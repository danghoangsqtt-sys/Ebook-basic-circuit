<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A23 — Ngoại Vi MCU &amp; Lab GPIO Pico</title><desc id="desc">Sơ đồ Raspberry Pi Pico non-W tham khảo: GPIO GP25 của RP2040 điều khiển LED tích hợp trên board; timeline high 250 mili giây, low 250 mili giây lặp lại cho chu kỳ danh định 500 mili giây và tần số 2 hertz.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A23 · Ngoại Vi MCU &amp; Lab GPIO Pico</text><rect x="36" y="78" width="828" height="320" rx="16" fill="#1e293b"/><rect x="70" y="121" width="330" height="95" rx="12" fill="#0f172a" stroke="#93c5fd" stroke-width="3"/><text x="91" y="159" fill="white" font-family="Arial" font-size="21">Pico non-W · RP2040</text><text x="91" y="192" fill="#93c5fd" font-family="Arial" font-size="20">GP25 → LED on-board</text><text x="485" y="130" fill="#cbd5e1" font-family="Arial" font-size="20">Lịch lệnh danh định</text><path d="M485 268V184H565V268H645V184H725V268H805" fill="none" stroke="#86efac" stroke-width="5"/><path d="M480 275H820" stroke="#cbd5e1" stroke-width="2"/><g fill="#e2e8f0" font-family="Arial" font-size="18"><text x="475" y="307">0</text><text x="548" y="307">250</text><text x="631" y="307">500</text><text x="711" y="307">750</text><text x="782" y="307">1000 ms</text><text x="70" y="293">high 250 ms + low 250 ms</text><text x="70" y="326">T danh định = 500 ms · f ≈ 2 Hz</text></g><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn/giới hạn tại caption bài học</text></svg>
