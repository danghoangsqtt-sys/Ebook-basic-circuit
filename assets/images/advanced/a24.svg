<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A24 — So Board Theo Mã &amp; Revision</title><desc id="desc">Hai thẻ so sánh board: Raspberry Pi Pico non-W tham chiếu board Rev3 dùng RP2040, LED GP25 và không có radio; ESP32-C6-DevKitC-1 v1.2 dùng module WROOM-1 hoặc WROOM-1U, RGB LED GPIO8 và radio Wi-Fi BLE 802.15.4.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A24 · So Board Theo Mã &amp; Revision</text><rect x="35" y="80" width="395" height="316" rx="16" fill="#1e293b"/><rect x="470" y="80" width="395" height="316" rx="16" fill="#1e293b"/><g fill="#93c5fd" font-family="Arial" font-size="23"><text x="60" y="125">Pico non-W · tham chiếu Rev3</text><text x="494" y="125">ESP32-C6-DevKitC-1 v1.2</text></g><g fill="white" font-family="Arial" font-size="20"><text x="62" y="180">RP2040 · 264 kB SRAM</text><text x="62" y="224">2 MB flash trên board</text><text x="62" y="268">LED đơn GP25</text><text x="62" y="312">Không radio tích hợp</text><text x="495" y="180">WROOM-1(U) · 8 MB flash</text><text x="495" y="224">Wi-Fi / BLE / 802.15.4</text><text x="495" y="268">RGB addressable · GPIO8</text><text x="495" y="312">Schematic theo PW batch</text></g><text x="172" y="422" fill="#cbd5e1" font-family="Arial" font-size="18">Model và revision thật phải được kiểm trước khi lắp</text><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn/giới hạn tại caption bài học</text></svg>
