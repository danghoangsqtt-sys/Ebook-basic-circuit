<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A25 — Bản Đồ Cảm Biến Theo Đại Lượng</title><desc id="desc">Bản đồ bảy part cảm biến: TMP36/DS18B20 nhiệt độ, OPT3001 ánh sáng, DRV5032 từ trường, BMP280 áp suất, LSM6DSOX chuyển động, VL53L1X khoảng cách; mỗi nhánh có dạng I/O.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A25 · Bản Đồ Cảm Biến Theo Đại Lượng</text><rect x="35" y="85" width="830" height="310" rx="18" fill="#1e293b"/><g fill="#93c5fd" font-family="Arial" font-size="21"><text x="75" y="135">Nhiệt · TMP36 / DS18B20</text><text x="75" y="200">Ánh sáng · OPT3001</text><text x="75" y="265">Từ · DRV5032</text><text x="480" y="135">Áp suất · BMP280</text><text x="480" y="200">Chuyển động · LSM6DSOX</text><text x="480" y="265">Khoảng cách · VL53L1X</text></g><g fill="#e2e8f0" font-family="Arial" font-size="18"><text x="75" y="350">VOUT · 1-Wire · I²C · mức số</text><text x="480" y="350">I²C/SPI · I²C</text></g><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn/giới hạn tại caption bài học</text></svg>
