<title id="title">A17 — Nhị Phân &amp; Mức Logic</title><desc id="desc">Bốn trọng số nhị phân 8, 4, 2, 1 cho số 1101 bằng 13; bên phải là ba vùng điện áp đầu vào của SN74HC00 tại VCC 4,5 V: không quá 1,35 V, vùng chưa bảo đảm, và từ 3,15 V.</desc>
<rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A17 · Nhị Phân &amp; Mức Logic</text>
<rect x="36" y="78" width="386" height="320" rx="16" fill="#1e293b"/><text x="60" y="114" fill="#93c5fd" font-size="21" font-family="Arial">1101₂ = 13₁₀</text><g fill="#e2e8f0" font-size="32" font-family="Arial"><text x="76" y="190">1</text><text x="165" y="190">1</text><text x="254" y="190">0</text><text x="343" y="190">1</text></g><g fill="#cbd5e1" font-size="20" font-family="Arial"><text x="68" y="235">8</text><text x="157" y="235">4</text><text x="246" y="235">2</text><text x="335" y="235">1</text><text x="65" y="310">8 + 4 + 0 + 1 = 13</text></g><rect x="454" y="78" width="410" height="320" rx="16" fill="#1e293b"/><text x="474" y="115" fill="#93c5fd" font-size="20" font-family="Arial">SN74HC00 · VCC=4,5 V</text><rect x="476" y="150" width="366" height="58" fill="#14532d"/><rect x="476" y="208" width="366" height="58" fill="#713f12"/><rect x="476" y="266" width="366" height="58" fill="#1d4ed8"/><g fill="white" font-family="Arial" font-size="20"><text x="494" y="187">0–1,35 V · LOW bảo đảm</text><text x="494" y="245">(1,35;3,15) V · chưa bảo đảm</text><text x="494" y="303">3,15–4,5 V · HIGH bảo đảm</text></g><text x="478" y="365" fill="#cbd5e1" font-family="Arial" font-size="16">Ngưỡng đầu vào, không phải mức ra</text>
<text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn và giả định ghi tại caption bài học</text></svg>
