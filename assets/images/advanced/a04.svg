<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">A04: Mạch RC với điện dung hữu hiệu dưới DC bias</title>
  <desc id="desc">Nguồn bước 5 volt nối qua R 10 kiloohm đến nút Vout. Tụ Ceff từ Vout xuống GND, cực dương ở Vout nếu chọn tụ phân cực. Mô hình bài toán lấy C danh định 10 microfarad, Ceff bằng 6 microfarad dưới bias, khiến hằng số thời gian đổi từ 100 xuống 60 mili giây. Nhánh ESR và rò là giới hạn của mô hình lý tưởng.</desc>
  <rect width="560" height="420" rx="18" fill="#101827"/>
  <g font-family="Arial, sans-serif" fill="#eaf3ff">
    <text x="28" y="42" font-size="22" font-weight="700">Mạch nạp RC: danh định khác hữu hiệu</text>
    <g stroke="#9bd7e6" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M65 205 V111 H194 M315 111 H425 V174 M425 190 V309 H65 V260"/>
      <path d="M194 111 h15 l10 -14 l18 28 l18 -28 l18 28 l18 -28 l10 14 h14"/>
      <path d="M390 174 H460 M390 190 H460"/>
      <circle cx="65" cy="232" r="27"/>
      <circle cx="425" cy="111" r="5" fill="#9bd7e6"/>
    </g>
    <text x="59" y="227" font-size="16">+</text>
    <text x="60" y="250" font-size="16">−</text>
    <text x="35" y="170" font-size="16">5 V</text>
    <text x="216" y="83" font-size="17">R = 10 kΩ</text>
    <text x="445" y="119" font-size="16">Vout +</text>
    <text x="465" y="193" font-size="17">Ceff</text>
    <text x="397" y="334" font-size="16">GND</text>
    <rect x="24" y="352" width="512" height="48" rx="10" fill="#1d3046" stroke="#69cfb6"/>
    <text x="42" y="373" font-size="15">Ví dụ giả định: 10 µF → 6 µF tại bias</text>
    <text x="42" y="391" font-size="15">τ: 100 ms → 60 ms; không phải số liệu cho mọi X5R</text>
  </g>
</svg>
