<title id="title">A18 — Boolean &amp; Cổng Logic</title><desc id="desc">Hai đầu vào A và B đi vào cổng NAND, đầu ra Y bằng NOT của A AND B. Bảng bốn hàng 00, 01, 10, 11 cho Y lần lượt 1, 1, 1, 0.</desc>
<rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A18 · Boolean &amp; Cổng Logic</text>
<rect x="36" y="78" width="390" height="320" rx="16" fill="#1e293b"/><g stroke="#93c5fd" stroke-width="4" fill="none"><path d="M70 196H170 M70 276H170 M328 236H380"/><path d="M170 155H236 Q310 155 310 236 Q310 317 236 317 H170Z"/></g><circle cx="321" cy="236" r="11" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/><g fill="white" font-family="Arial" font-size="24"><text x="55" y="184">A</text><text x="55" y="267">B</text><text x="388" y="244">Y</text><text x="174" y="360">Y = ¬(A·B)</text></g><rect x="458" y="78" width="406" height="320" rx="16" fill="#1e293b"/><g font-family="Arial" font-size="24" fill="#e2e8f0"><text x="510" y="133">A B</text><text x="710" y="133">Y</text><text x="510" y="185">0 0</text><text x="710" y="185">1</text><text x="510" y="237">0 1</text><text x="710" y="237">1</text><text x="510" y="289">1 0</text><text x="710" y="289">1</text><text x="510" y="341">1 1</text><text x="710" y="341">0</text></g>
<text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn và giả định ghi tại caption bài học</text></svg>
