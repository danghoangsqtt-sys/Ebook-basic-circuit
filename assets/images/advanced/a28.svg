<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A28 — Sai Số, Hiệu Chuẩn &amp; Lọc Cảm Biến</title><desc id="desc">Đồ thị hiệu chuẩn TMP36 giả định với hai điểm fit 0 độ C ứng với 0,510 V và 50 độ C ứng với 1,005 V, điểm kiểm độc lập 25 độ C ứng với 0,762 V; đường danh định và đường hiệu chuẩn được phân biệt.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A28 · Sai Số, Hiệu Chuẩn &amp; Lọc Cảm Biến</text><rect x="35" y="85" width="830" height="310" rx="18" fill="#1e293b"/><path d="M130 332 L750 123" fill="none" stroke="#fbbf24" stroke-width="4"/><path d="M130 336 L750 125" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="10 7"/><g fill="#93c5fd" font-family="Arial" font-size="20"><text x="67" y="380">0 °C · 0,510 V</text><text x="350" y="380">25 °C · 0,762 V (kiểm)</text><text x="680" y="380">50 °C · 1,005 V</text></g><g fill="#e2e8f0" font-family="Arial" font-size="20"><text x="135" y="145">Vàng: fit · xanh: danh định</text><text x="450" y="112">Sai số kiểm +0,455 °C</text></g><circle cx="130" cy="332" r="8" fill="#fbbf24"/><circle cx="750" cy="123" r="8" fill="#fbbf24"/><circle cx="440" cy="225" r="7" fill="#ef4444"/><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn/giới hạn tại caption bài học</text></svg>
