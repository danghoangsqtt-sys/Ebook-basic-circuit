<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">A21 — FSM, Clock &amp; Kiểm Timing</title><desc id="desc">FSM Moore ba trạng thái G xanh, Y vàng, R đỏ. Với advance bằng 1 ở cạnh clock: G sang Y, Y sang R, R sang G; advance bằng 0 giữ trạng thái. Bên dưới là ngân sách setup giả định: 20 cộng 30 cộng 15 bằng 65 ns nhỏ hơn chu kỳ 100 ns.</desc>
<rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A21 · FSM, Clock &amp; Kiểm Timing</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#93c5fd"/></marker></defs><rect x="36" y="78" width="828" height="320" rx="16" fill="#1e293b"/><g fill="#14532d" stroke="#86efac" stroke-width="3"><circle cx="172" cy="204" r="60"/></g><g fill="#713f12" stroke="#fde68a" stroke-width="3"><circle cx="450" cy="204" r="60"/></g><g fill="#7f1d1d" stroke="#fca5a5" stroke-width="3"><circle cx="728" cy="204" r="60"/></g><g fill="white" font-family="Arial" font-size="29" text-anchor="middle"><text x="172" y="213">G</text><text x="450" y="213">Y</text><text x="728" y="213">R</text></g><g stroke="#93c5fd" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M232 204H382"/><path d="M510 204H660"/><path d="M728 265V321H172V270"/></g><g fill="#e2e8f0" font-family="Arial" font-size="19"><text x="280" y="188">advance=1</text><text x="558" y="188">advance=1</text><text x="360" y="315">advance=1 · quay về G</text><text x="93" y="112">advance=0: mỗi trạng thái giữ nguyên tại cạnh</text><text x="133" y="370">Setup giả định: 20 + 30 + 15 = 65 ns ≤ T 100 ns</text></g>
<text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn và giả định ghi tại caption bài học</text></svg>
