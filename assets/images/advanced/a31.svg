<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A31 — Khối Cảm Biến, ADC &amp; MCU</title><desc id="desc">TMP36 VOUT đi tới GP26 ADC0, phần mềm đổi mã sang nhiệt rồi qua FSM hai ngưỡng tới LED GP25; raw và VREF cần được giữ.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="35" y="50" fill="#e2e8f0" font-family="Arial" font-size="25" font-weight="bold">A31 — Khối Cảm Biến, ADC &amp; MCU</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="40" y="130" width="245" height="180" rx="16" fill="#164e63"/><rect x="327" y="130" width="245" height="180" rx="16" fill="#14532d"/><rect x="614" y="130" width="245" height="180" rx="16" fill="#713f12"/><text x="162" y="230" fill="white">TMP36 VOUT</text><text x="449" y="230" fill="white">GP26 ADC0 / raw</text><text x="736" y="230" fill="white">FSM → LED GP25</text></g><path d="M285 220H327M572 220H614" stroke="#93c5fd" stroke-width="4"/><text x="45" y="405" fill="#cbd5e1" font-family="Arial" font-size="18">Mô hình học tập · xem netlist, điều kiện và giới hạn trong bài</text></svg>
