<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
  <title id="title">A07: Ranh giới adapter cách ly, ổn áp tuyến tính và tải thấp áp</title>
  <desc id="desc">Bài toán bắt đầu tại jack DC của adapter GST18A09-P1J đóng vỏ, center dương 9 volt danh định. Từ cực dương jack đi tới chân IN của LM7805, chân OUT tới tải 5 volt 0,2 ampere; GND adapter, chân GND IC và cực âm tải chung. Tụ input và output tham chiếu Figure 18 của TI và phải kiểm đúng part. Không có đấu nối lưới hay pin trong sơ đồ.</desc>
  <rect width="560" height="390" rx="16" fill="#101827"/>
  <g font-family="Arial,sans-serif" fill="#eef6ff">
    <text x="24" y="39" font-size="20" font-weight="700">Chỉ bắt đầu ở jack DC của adapter đóng vỏ</text>
    <rect x="23" y="76" width="142" height="185" rx="10" fill="#253a48" stroke="#74d1c5"/>
    <text x="38" y="109" font-size="16" font-weight="700">GST18A09-P1J</text>
    <text x="38" y="139" font-size="14">đầu jack DC</text>
    <text x="38" y="166" font-size="14">+9 V danh định</text>
    <text x="38" y="191" font-size="14">2 A danh định</text>
    <text x="38" y="221" font-size="14">center +</text>
    <rect x="213" y="100" width="135" height="135" rx="10" fill="#243352" stroke="#91b6ff"/>
    <text x="231" y="139" font-size="17" font-weight="700">LM7805</text>
    <text x="221" y="172" font-size="14">IN → OUT</text>
    <text x="245" y="209" font-size="14">GND</text>
    <rect x="398" y="120" width="135" height="115" rx="10" fill="#3a3545" stroke="#ffc888"/>
    <text x="421" y="154" font-size="17" font-weight="700">Tải</text>
    <text x="412" y="184" font-size="15">5 V · 0,2 A</text>
    <text x="419" y="209" font-size="14">giả định</text>
    <path d="M165 145 H213 M348 145 H398 M93 261 V284 H280 V235 M280 284 H465 V235" fill="none" stroke="#9dc4d0" stroke-width="3"/>
    <text x="187" y="134" font-size="14">VIN</text><text x="358" y="134" font-size="14">VOUT</text>
    <text x="237" y="310" font-size="15">GND / cực âm chung</text>
    <rect x="23" y="329" width="510" height="39" rx="8" fill="#302f3b" stroke="#ffcc80"/>
    <text x="37" y="354" font-size="14">Pd ≈ (9 − 5) × 0,2 = 0,8 W; chưa duyệt nhiệt</text>
  </g>
</svg>
