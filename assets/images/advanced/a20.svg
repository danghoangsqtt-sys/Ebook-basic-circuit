<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">A20 — Latch, Flip-Flop &amp; Bộ Đếm</title><desc id="desc">D flip-flop lấy mẫu D ở ba cạnh lên của CLK; D trước các cạnh là 1, 0, 1 và Q sau các cạnh là 1, 0, 1. Bên cạnh là chu trình đếm mod-4 00, 01, 10, 11 rồi về 00.</desc>
<rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A20 · Latch, Flip-Flop &amp; Bộ Đếm</text>
<rect x="36" y="78" width="414" height="320" rx="16" fill="#1e293b"/><text x="60" y="119" font-family="Arial" font-size="22" fill="#93c5fd">DFF · cạnh lên</text><path d="M84 270H385" stroke="#e2e8f0" stroke-width="3"/><g stroke="#38bdf8" stroke-width="4"><path d="M130 285V180 M240 285V180 M350 285V180"/></g><g font-family="Arial" font-size="20" fill="#e2e8f0"><text x="114" y="318">1</text><text x="224" y="318">2</text><text x="334" y="318">3</text><text x="80" y="165">D trước:</text><text x="125" y="225">1</text><text x="235" y="225">0</text><text x="345" y="225">1</text><text x="80" y="365">Q sau: 1 → 0 → 1</text></g><rect x="476" y="78" width="388" height="320" rx="16" fill="#1e293b"/><text x="500" y="119" font-family="Arial" font-size="22" fill="#93c5fd">Đếm mod-4 lý tưởng</text><g font-family="Arial" font-size="29" fill="white"><text x="535" y="207">00 → 01</text><text x="535" y="263">↑         ↓</text><text x="535" y="319">11 ← 10</text></g>
<text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn và giả định ghi tại caption bài học</text></svg>
