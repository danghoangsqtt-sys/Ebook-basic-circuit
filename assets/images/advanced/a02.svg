<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="title desc">
  <title id="title">A02: cầu chia áp NTC 100 kiloohm</title>
  <desc id="desc">Nguồn 3,3 volt qua điện trở cố định 100 kiloohm đến nút Vout, rồi qua NTC 100 kiloohm ở 25 độ C xuống ground. Nút Vout là điểm đo điện áp so với ground. Khi nhiệt độ tăng, điện trở NTC giảm nên Vout giảm. Bảng dưới ghi tại 25 độ C Vout 1,650 volt, 35 độ C khoảng 1,268 volt và 45 độ C khoảng 0,947 volt theo bảng R chia R25 của TDK.</desc>
  <rect width="880" height="490" rx="18" fill="#0d1b2a"/>
  <text x="35" y="49" fill="#f8fafc" font-family="Arial,sans-serif" font-size="27" font-weight="700">Đo nhiệt độ bằng điện trở biến thiên</text>
  <text x="35" y="80" fill="#b7c9da" font-family="Arial,sans-serif" font-size="17">Sơ đồ lý tưởng của NTC TDK B57891M0104J000, nguồn 3,3 V giả định</text>
  <rect x="35" y="109" width="440" height="327" rx="16" fill="#142b40" stroke="#5c7891" stroke-width="2"/>
  <text x="63" y="148" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19">+3,3 V</text>
  <line x1="260" y1="137" x2="260" y2="178" stroke="#e7f0f8" stroke-width="4"/>
  <rect x="225" y="178" width="70" height="60" rx="5" fill="#e8f2fb"/>
  <text x="237" y="203" fill="#102235" font-family="Arial,sans-serif" font-size="16" font-weight="700">R1</text>
  <text x="230" y="225" fill="#102235" font-family="Arial,sans-serif" font-size="15">100 kΩ</text>
  <line x1="260" y1="238" x2="260" y2="290" stroke="#e7f0f8" stroke-width="4"/>
  <circle cx="260" cy="267" r="8" fill="#43d9a3"/>
  <line x1="260" y1="267" x2="398" y2="267" stroke="#43d9a3" stroke-width="3"/>
  <text x="337" y="252" fill="#b6e9d2" font-family="Arial,sans-serif" font-size="18" font-weight="700">Vout</text>
  <rect x="218" y="290" width="84" height="62" rx="5" fill="#d8ecff"/>
  <text x="228" y="316" fill="#102235" font-family="Arial,sans-serif" font-size="17" font-weight="700">NTC</text>
  <text x="227" y="340" fill="#102235" font-family="Arial,sans-serif" font-size="14">100 kΩ*</text>
  <line x1="260" y1="352" x2="260" y2="386" stroke="#e7f0f8" stroke-width="4"/>
  <line x1="230" y1="386" x2="290" y2="386" stroke="#e7f0f8" stroke-width="4"/>
  <line x1="239" y1="396" x2="281" y2="396" stroke="#e7f0f8" stroke-width="4"/>
  <line x1="249" y1="406" x2="271" y2="406" stroke="#e7f0f8" stroke-width="4"/>
  <text x="316" y="396" fill="#f8fafc" font-family="Arial,sans-serif" font-size="17">GND / 0 V</text>
  <rect x="496" y="109" width="349" height="327" rx="16" fill="#173329" stroke="#43d9a3" stroke-width="2"/>
  <text x="518" y="151" fill="#f8fafc" font-family="Arial,sans-serif" font-size="21" font-weight="700">Giá trị kỳ vọng</text>
  <text x="518" y="190" fill="#e9f5ef" font-family="Arial,sans-serif" font-size="17">T (°C)      RNTC (kΩ)      Vout (V)</text>
  <line x1="518" y1="200" x2="820" y2="200" stroke="#79b79a"/>
  <text x="518" y="232" fill="#e9f5ef" font-family="Arial,sans-serif" font-size="18">25           100,000          1,650</text>
  <text x="518" y="266" fill="#e9f5ef" font-family="Arial,sans-serif" font-size="18">35             62,372          1,268</text>
  <text x="518" y="300" fill="#e9f5ef" font-family="Arial,sans-serif" font-size="18">45             40,218          0,947</text>
  <line x1="518" y1="317" x2="820" y2="317" stroke="#79b79a"/>
  <text x="518" y="351" fill="#b6e9d2" font-family="Arial,sans-serif" font-size="17">Vout = 3,3 × RNTC / (100k + RNTC)</text>
  <text x="518" y="394" fill="#b6e9d2" font-family="Arial,sans-serif" font-size="16">Nhiệt tăng → R giảm → Vout giảm</text>
  <text x="35" y="462" fill="#b7c9da" font-family="Arial,sans-serif" font-size="14">*R25 = 100 kΩ danh định. Tỉ số R(T)/R25: TDK B57891M, bảng R/T số 4003, tr. 8; hình tự vẽ.</text>
</svg>
