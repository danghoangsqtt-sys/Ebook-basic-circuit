<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">A19 — Mạch Tổ Hợp &amp; Bộ Chọn Kênh</title><desc id="desc">Mux hai ngõ dữ liệu A, B và ngõ chọn S. Nhánh A qua AND với NOT S, nhánh B qua AND với S, hai nhánh qua OR cho Y bằng NOT S AND A OR S AND B.</desc>
<rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A19 · Mạch Tổ Hợp &amp; Bộ Chọn Kênh</text>
<rect x="36" y="78" width="828" height="320" rx="16" fill="#1e293b"/><g fill="#0f172a" stroke="#93c5fd" stroke-width="3"><rect x="110" y="136" width="255" height="78" rx="12"/><rect x="110" y="240" width="255" height="78" rx="12"/><rect x="510" y="185" width="135" height="78" rx="12"/></g><g stroke="#93c5fd" stroke-width="4" fill="none"><path d="M365 175H440V205H510 M365 279H440V244H510 M645 224H748"/></g><g font-family="Arial" font-size="22" fill="white"><text x="132" y="169">AND nhánh A</text><text x="132" y="196">¬S · A</text><text x="132" y="273">AND nhánh B</text><text x="132" y="300">S · B</text><text x="554" y="233">OR</text><text x="757" y="233">Y</text></g><text x="118" y="360" font-family="Arial" font-size="20" fill="#cbd5e1">S=0 chọn A; S=1 chọn B · Y = ¬S·A + S·B</text>
<text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn và giả định ghi tại caption bài học</text></svg>
