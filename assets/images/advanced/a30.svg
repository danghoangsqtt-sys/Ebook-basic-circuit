<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A30 — Thiết Kế Nguồn Thấp Áp Cho Hệ</title><desc id="desc">Nguồn USB đi qua diode D1, VSYS và SMPS có sẵn trên Pico tới 3V3 OUT cấp TMP36; C1 bypass giữa rail và AGND.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="35" y="50" fill="#e2e8f0" font-family="Arial" font-size="25" font-weight="bold">A30 — Thiết Kế Nguồn Thấp Áp Cho Hệ</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="40" y="130" width="245" height="180" rx="16" fill="#164e63"/><rect x="327" y="130" width="245" height="180" rx="16" fill="#14532d"/><rect x="614" y="130" width="245" height="180" rx="16" fill="#713f12"/><text x="162" y="230" fill="white">USB → VSYS</text><text x="449" y="230" fill="white">SMPS → 3V3 OUT</text><text x="736" y="230" fill="white">TMP36 + C1 → AGND</text></g><path d="M285 220H327M572 220H614" stroke="#93c5fd" stroke-width="4"/><text x="45" y="405" fill="#cbd5e1" font-family="Arial" font-size="18">Mô hình học tập · xem netlist, điều kiện và giới hạn trong bài</text></svg>
