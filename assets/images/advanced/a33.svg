<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A33 — Họ Board MCU &amp; Chi Tiết Arduino Uno R3</title><desc id="desc">Sơ đồ khối Arduino Uno R3: USB hoặc jack DC đi qua bộ ổn áp tới rail 5 V, vi điều khiển ATmega328P ở giữa, bên phải là ba nhóm chân: D0 đến D13, A0 đến A5 và chân nguồn.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><g font-family="Arial"><text font-weight="bold" x="35" y="50" fill="#e2e8f0" font-size="25" text-anchor="start">A33 — Họ Board MCU &amp; Chi Tiết Arduino Uno R3</text><rect x="30" y="90" width="220" height="110" rx="14" fill="#164e63"/><text x="140" y="132" fill="white" font-size="18" text-anchor="middle">USB-B  ·  5 V</text><text x="140" y="160" fill="white" font-size="18" text-anchor="middle">Jack DC</text><text x="140" y="185" fill="white" font-size="16" text-anchor="middle">Vin 7–12 V khuyến nghị</text><rect x="30" y="250" width="220" height="120" rx="14" fill="#14532d"/><text x="140" y="292" fill="white" font-size="18" text-anchor="middle">Ổn áp trên board</text><text x="140" y="320" fill="white" font-size="18" text-anchor="middle">→ rail 5 V</text><text x="140" y="345" fill="white" font-size="16" text-anchor="middle">3V3 tối đa ~50 mA</text><rect x="300" y="90" width="280" height="280" rx="14" fill="#1e293b"/><text x="440" y="135" fill="white" font-size="22" text-anchor="middle">ATmega328P</text><text x="440" y="170" fill="white" font-size="18" text-anchor="middle">16 MHz</text><text x="440" y="215" fill="white" font-size="18" text-anchor="middle">Flash 32 KB</text><text x="440" y="245" fill="white" font-size="18" text-anchor="middle">SRAM 2 KB</text><text x="440" y="275" fill="white" font-size="18" text-anchor="middle">EEPROM 1 KB</text><text x="440" y="320" fill="white" font-size="18" text-anchor="middle">ADC 10 bit</text><rect x="630" y="90" width="240" height="75" rx="14" fill="#713f12"/><text x="750" y="122" fill="white" font-size="20" text-anchor="middle">D0–D13</text><text x="750" y="148" fill="white" font-size="16" text-anchor="middle">6 chân PWM</text><rect x="630" y="185" width="240" height="75" rx="14" fill="#713f12"/><text x="750" y="217" fill="white" font-size="20" text-anchor="middle">A0–A5</text><text x="750" y="243" fill="white" font-size="16" text-anchor="middle">A4 SDA · A5 SCL</text><rect x="630" y="280" width="240" height="90" rx="14" fill="#713f12"/><text x="750" y="312" fill="white" font-size="18" text-anchor="middle">5V · 3V3 · VIN</text><text x="750" y="338" fill="white" font-size="18" text-anchor="middle">GND · AREF</text><path d="M250 145H300M250 310H275V230H300M580 128H630M580 222H630M580 325H630" stroke="#93c5fd" stroke-width="4" fill="none"/><text x="45" y="430" fill="#cbd5e1" font-size="18" text-anchor="start">Khái niệm theo tài liệu hãng · không là netlist, không là phép đo</text></g></svg>
