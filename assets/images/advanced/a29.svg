<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A29 — Từ Yêu Cầu Đến Sơ Đồ Khối</title><desc id="desc">Ba khối USB/Pico, TMP36 và firmware/hysteresis/LED; đường nguồn 3V3, tín hiệu TEMP_V và hồi AGND được nêu rõ.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="35" y="50" fill="#e2e8f0" font-family="Arial" font-size="25" font-weight="bold">A29 — Từ Yêu Cầu Đến Sơ Đồ Khối</text><g font-family="Arial" font-size="18" text-anchor="middle"><rect x="40" y="130" width="245" height="180" rx="16" fill="#164e63"/><rect x="327" y="130" width="245" height="180" rx="16" fill="#14532d"/><rect x="614" y="130" width="245" height="180" rx="16" fill="#713f12"/><text x="162" y="230" fill="white">USB / Pico</text><text x="449" y="230" fill="white">3V3 → TMP36</text><text x="736" y="230" fill="white">ADC → FSM → LED</text></g><path d="M285 220H327M572 220H614" stroke="#93c5fd" stroke-width="4"/><text x="45" y="405" fill="#cbd5e1" font-family="Arial" font-size="18">Mô hình học tập · xem netlist, điều kiện và giới hạn trong bài</text></svg>
