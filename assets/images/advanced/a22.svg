<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A22 — CPU, Bộ Nhớ, Bus &amp; Hệ Xử Lý</title><desc id="desc">Sơ đồ khối học tập của Raspberry Pi Pico không dây đời đầu: hai lõi Cortex-M0+ trong RP2040 qua bus fabric tới SRAM 264 kB, ngoại vi và cổng QSPI/XIP; flash 2 MB nằm ngoài chip nhưng trên board Pico.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A22 · CPU, Bộ Nhớ, Bus &amp; Hệ Xử Lý</text><rect x="35" y="82" width="830" height="316" rx="16" fill="#1e293b"/><rect x="55" y="110" width="600" height="270" rx="14" fill="#0f172a" stroke="#93c5fd" stroke-width="3"/><text x="78" y="140" fill="#93c5fd" font-size="20" font-family="Arial">RP2040 · ranh giới chip</text><g stroke="#93c5fd" stroke-width="4" fill="none"><path d="M140 215V245H200V266 M286 215V266 M375 293H400V190H426 M375 304H426 M375 277H395V235H665V244H680"/></g><rect x="82" y="160" width="115" height="55" rx="8" fill="#1d4ed8"/><rect x="230" y="160" width="115" height="55" rx="8" fill="#1d4ed8"/><rect x="162" y="266" width="213" height="70" rx="8" fill="#164e63"/><rect x="426" y="160" width="205" height="62" rx="8" fill="#14532d"/><rect x="426" y="269" width="205" height="70" rx="8" fill="#155e75"/><rect x="680" y="209" width="165" height="86" rx="8" fill="#713f12"/><g fill="white" font-family="Arial" font-size="18"><text x="100" y="194">CPU 0</text><text x="248" y="194">CPU 1</text><text x="186" y="308">Bus fabric</text><text x="445" y="196">SRAM 264 kB</text><text x="443" y="300">GPIO / ADC</text><text x="443" y="323">timer · chip</text><text x="695" y="245">QSPI flash</text><text x="695" y="271">2 MB · board</text></g><text x="682" y="333" fill="#cbd5e1" font-family="Arial" font-size="17">ngoài RP2040</text><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình