<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">A26 — Cảm Biến Nhiệt, Ánh Sáng &amp; Từ</title><desc id="desc">Bảng chọn có ba nhánh: nhiệt TMP36 analog so DS18B20 1-Wire; ánh sáng OPT3001 I²C so LDR chia áp; từ DRV5032 Hall switch so reed switch; bên dưới là cổng supply và thời gian.</desc><rect width="900" height="480" rx="24" fill="#0f172a"/><text x="36" y="48" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="25" font-weight="700">A26 · Cảm Biến Nhiệt, Ánh Sáng &amp; Từ</text><rect x="35" y="85" width="830" height="310" rx="18" fill="#1e293b"/><g fill="#93c5fd" font-family="Arial" font-size="23"><text x="65" y="145">NHIỆT</text><text x="65" y="230">ÁNH SÁNG</text><text x="65" y="315">TỪ</text></g><g fill="#e2e8f0" font-family="Arial" font-size="21"><text x="280" y="145">TMP36 analog ↔ DS18B20 1-Wire</text><text x="280" y="230">OPT3001 lux ↔ LDR chia áp</text><text x="280" y="315">DRV5032 Hall ↔ reed switch</text></g><text x="36" y="450" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Mô hình học tập · nguồn/giới hạn tại caption bài học</text></svg>
