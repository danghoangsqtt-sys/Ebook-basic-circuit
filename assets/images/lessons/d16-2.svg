<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 653" width="360" height="653" role="img" aria-labelledby="title desc"><title id="title">Công tắc NPN cho buzzer active DC</title><desc id="desc">Nguồn +5 V vào cực dương buzzer active; cực âm buzzer đến collector transistor; emitter về GND. GPIO 3,3 V qua điện trở base tới B. Chọn BC547/BC337 và điện trở theo dòng thực tế của buzzer, giới hạn GPIO và datasheet transistor; chung GND.</desc><rect width="360" height="653" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Công tắc NPN cho buzzer active DC</text><rect x="16" y="55" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="74" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">NHÁNH BUZZER</text><rect class="node" x="31" y="93" width="298" height="36" rx="8"/><text x="180" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">+5 V</text><path class="wire" d="M180 129 v13"/><path d="M175 137 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="147" width="298" height="36" rx="8"/><text x="180" y="170" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Buzzer active (+ → −)</text><path class="wire" d="M180 183 v13"/><path d="M175 191 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="201" width="298" height="36" rx="8"/><text x="180" y="224" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">C • NPN</text><path class="wire" d="M180 237 v13"/><path d="M175 245 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="255" width="298" height="36" rx="8"/><text x="180" y="278" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">E → GND</text><rect x="16" y="304" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="323" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">NHÁNH BASE</text><rect class="node" x="31" y="342" width="298" height="36" rx="8"/><text x="180" y="365" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">GPIO 3,3 V</text><path class="wire" d="M180 378 v13"/><path d="M175 386 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="396" width="298" height="36" rx="8"/><text x="180" y="419" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">R_B theo dòng tải</text><path class="wire" d="M180 432 v13"/><path d="M175 440 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="450" width="298" height="36" rx="8"/><text x="180" y="473" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">B • NPN</text><rect x="16" y="499" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="518" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">CẦN KIỂM</text><rect class="node" x="31" y="537" width="298" height="36" rx="8"/><text x="180" y="560" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Dòng định mức buzzer</text><path class="wire" d="M180 573 v13"/><path d="M175 581 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="591" width="298" height="36" rx="8"/><text x="180" y="614" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">GPIO và pinout đúng mã</text></svg>