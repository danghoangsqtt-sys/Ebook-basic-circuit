<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-labelledby="title desc"><title id="title">UART 5 V → RX 3,0 V</title><desc id="desc">TX 5 V qua R1 10 kiloohm tới nút RX, R2 15 kiloohm nối nút RX về GND chung. Đây là mạch một chiều push-pull; Vout xấp xỉ 3,0 V khi đầu vào 5 V và tải RX trở kháng cao. Kiểm sai số nguồn, điện trở và ngưỡng GPIO.</desc><rect width="360" height="350" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">UART 5 V → RX 3,0 V</text>
<path class="w" d="M30 123 H94 M156 123 H300 M225 123 V166 M225 209 V264 H300"/>
<text x="28" y="103" font-size="13">TX 5 V</text><rect class="c" x="94" y="103" width="62" height="40" rx="6"/><text x="125" y="128" text-anchor="middle" font-size="12">R1 10 kΩ</text>
<circle cx="225" cy="123" r="5" class="n"/><text x="245" y="106" font-size="12">RX ~3,0 V</text><rect class="c" x="193" y="166" width="64" height="43" rx="6"/><text x="225" y="192" text-anchor="middle" font-size="12">R2 15 kΩ</text><text x="262" y="280" font-size="12">GND chung</text>
<text x="180" y="318" text-anchor="middle" font-size="12">5 × 15 / (10 + 15) = 3,0 V</text>
</svg>
