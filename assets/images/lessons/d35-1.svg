<text x="26" y="547" fill="#34d399" font-family="Arial,sans-serif" font-size="14" font-weight="700">GND = VIN− = VOUT−; tab → GND.</text>
<text x="26" y="577" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">FB pin 4 lấy từ VOUT+ sau L.</text>
<text x="26" y="602" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">ON/OFF pin 5 xuống GND để bật.</text>
<text x="26" y="627" fill="#fbbf24" font-family="Arial,sans-serif" font-size="13" font-weight="400">Giá trị L, Cin, Cout: chọn theo TI Rev.G.</text>
