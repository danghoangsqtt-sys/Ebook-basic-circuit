<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" role="img" aria-labelledby="title desc"><title id="title">LM2596S-5.0 · topology</title><desc id="desc">LM2596S-5.0 pin 1 VIN, pin 2 SW output to L, pin 3 GND, pin 4 feedback VOUT, pin 5 ON OFF tied GND. Diode cathode SW anode GND; Cin and Cout return GND.</desc><rect width="400" height="650" rx="16" fill="#10233b"/>
<text x="20" y="38" fill="#f8fafc" font-family="Arial,sans-serif" font-size="20" font-weight="700">LM2596S-5.0 · topology</text>
<text x="20" y="66" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="400">Bản fixed 5 V; pin 2 là SW, không phải 5 V.</text>
<text x="22" y="117" fill="#34d399" font-family="Arial,sans-serif" font-size="15" font-weight="700">VIN+</text>
