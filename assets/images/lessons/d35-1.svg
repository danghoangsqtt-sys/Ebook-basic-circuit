<text x="137" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">1 VIN</text>
<text x="212" y="150" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">2 SW</text>
<text x="137" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">3 GND</text>
<text x="212" y="183" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">4 FB</text>
<text x="137" y="216" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13" font-weight="400">5 ON/OFF → GND</text>
<line x1="285" y1="112" x2="345" y2="112" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<circle cx="345" cy="112" r="5" fill="#34d399"/>
