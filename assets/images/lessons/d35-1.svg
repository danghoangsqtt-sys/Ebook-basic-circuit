<text x="350" y="359" fill="#34d399" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle">VOUT+</text>
<line x1="68" y1="112" x2="68" y2="265" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
