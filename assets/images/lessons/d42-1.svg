<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" width="400" height="720" role="img" aria-labelledby="title desc"><title id="title">Hệ thống robot WiFi: nguồn và tín hiệu</title><desc id="desc">Phần A: USB 5 V qua TP4056 sạc cell LiPo 1S có mạch bảo vệ; pin qua boost 5 V cấp cho ESP32, VM của TB6612FNG và motor, HC-SR04 và servo; ESP32 3,3 V cấp VCC của TB6612FNG; GND nối chung. Phần B: ESP32 điều khiển TB6612FNG bằng AIN, BIN, PWM và STBY; TRIG tới HC-SR04 còn ECHO qua chia áp 10k/15k về GPIO; servo SG90; OLED SSD1306 qua I2C; pin 1S qua chia áp 100k/100k vào ADC34.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="400" height="720" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<path class="w" d="M135 260 H185 M185 80 V260 M185 80 H225 M185 140 H225 M185 200 H225 M185 260 H225"/>
<text x="200" y="24" class="h" text-anchor="middle">A. Cấp nguồn</text>
<rect class="p" x="10" y="40" width="125" height="36" rx="8"/>
<text x="72.5" y="62" class="b" text-anchor="middle">USB 5 V</text>
<rect class="p" x="10" y="100" width="125" height="40" rx="8"/>
<text x="72.5" y="124" class="b" text-anchor="middle">TP4056 (sạc)</text>
<rect class="p" x="10" y="164" width="125" height="52" rx="8"/>
<text x="72.5" y="185.5" class="b" text-anchor="middle">Cell LiPo 1S</text>
<text x="72.5" y="202.5" text-anchor="middle">+ mạch bảo vệ 1S</text>
<rect class="y" x="10" y="240" width="125" height="40" rx="8"/>
<text x="72.5" y="264" class="b" text-anchor="middle">Boost 5 V</text>
<path class="a" d="M72 76 L72 99" marker-end="url(#ah)"/>
<path class="a" d="M72 140 L72 163" marker-end="url(#ah)"/>
<path class="a" d="M72 216 L72 239" marker-end="url(#ah)"/>
<text x="80" y="94" class="s">khi sạc</text>
<circle cx="185" cy="260" r="4.5" class="n"/>
<rect class="z" x="225" y="56" width="165" height="48" rx="8"/>
<text x="307.5" y="76" class="b" text-anchor="middle">ESP32</text>
<text x="307.5" y="92" text-anchor="middle">chân 5V</text>
<rect class="z" x="225" y="116" width="165" height="48" rx="8"/>
<text x="307.5" y="136" class="b" text-anchor="middle">TB6612FNG VM</text>
<text x="307.5" y="152" text-anchor="middle">+ motor</text>
<rect class="z" x="225" y="176" width="165" height="48" rx="8"/>
<text x="307.5" y="196" class="b" text-anchor="middle">HC-SR04</text>
<text x="307.5" y="212" text-anchor="middle">VCC</text>
<rect class="z" x="225" y="236" width="165" height="48" rx="8"/>
<text x="307.5" y="256" class="b" text-anchor="middle">Servo SG90</text>
<text x="307.5" y="272" text-anchor="middle">nguồn</text>
<text x="160" y="252" class="b" text-anchor="end">5 V</text>
<text x="14" y="306" class="m">ESP32 3,3 V → VCC của TB6612FNG; mọi GND nối chung</text>
<text x="14" y="322" class="m">USB 5 V → TP4056 → cell 1S khi sạc; kiểm tra power-path</text>
<text x="14" y="338" class="m">nếu vừa sạc vừa chạy</text>
<text x="200" y="384" class="h" text-anchor="middle">B. Tín hiệu</text>
<rect class="p" x="150" y="400" width="80" height="290" rx="8"/>
<text x="190" y="532" class="b" text-anchor="middle">ESP32</text>
<text x="190" y="549" text-anchor="middle">Web Server</text>
<text x="190" y="566" text-anchor="middle">cổng 80</text>
<rect class="y" x="5" y="440" width="105" height="70" rx="8"/>
<text x="57.5" y="463" class="b" text-anchor="middle">Pin 1S</text>
<text x="57.5" y="479" text-anchor="middle">chia áp</text>
<text x="57.5" y="495" text-anchor="middle">100k/100k</text>
<path class="a" d="M110 475 L150 475" marker-end="url(#ah)"/>
<text x="112" y="466" class="s">ADC34</text>
<rect class="z" x="285" y="400" width="110" height="100" rx="8"/>
<text x="340" y="430" class="b" text-anchor="middle">TB6612FNG</text>
<text x="340" y="446" text-anchor="middle">AIN1/2, BIN1/2</text>
<text x="340" y="462" text-anchor="middle">PWMA/B, STBY=HIGH</text>
<text x="340" y="478" text-anchor="middle">→ motor A/B</text>
<path class="a" d="M230 450 L285 450" marker-end="url(#ah)"/>
<rect class="z" x="285" y="515" width="110" height="76" rx="8"/>
<text x="340" y="533" class="b" text-anchor="middle">HC-SR04</text>
<text x="340" y="549" text-anchor="middle">TRIG ← GPIO</text>
<text x="340" y="565" text-anchor="middle">ECHO → chia áp</text>
<text x="340" y="581" text-anchor="middle">10k/15k → GPIO</text>
<path class="a" d="M230 553 L285 553" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect class="z" x="285" y="605" width="110" height="36" rx="8"/>
<text x="340" y="627" class="b" text-anchor="middle">SG90: SERVO_PIN</text>
<path class="a" d="M230 623 L285 623" marker-end="url(#ah)"/>
<rect class="z" x="285" y="655" width="110" height="50" rx="8"/>
<text x="340" y="676" class="b" text-anchor="middle">SSD1306 OLED</text>
<text x="340" y="692" text-anchor="middle">I2C: SDA, SCL</text>
<path class="a" d="M230 680 L285 680" marker-end="url(#ah)" marker-start="url(#ah)"/>
</svg>
