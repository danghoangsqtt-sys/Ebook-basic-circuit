<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 794" width="360" height="794" role="img" aria-labelledby="title desc"><title id="title">Khuếch đại emitter chung BC547</title><desc id="desc">Nguồn +12 V qua R_C 4,7 kΩ tới collector. Base nhận phân cực từ R1 150 kΩ lên +12 V và R2 22 kΩ xuống GND; Vin qua C_in 10 µF tới base. Emitter qua R_E 560 Ω về GND, C_E 47 µF song song R_E. Collector qua C_out 10 µF ra tải có đường DC về GND. Cực tính tụ điện phân phải kiểm theo điện áp DC và tải thực tế.</desc><rect width="360" height="794" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Khuếch đại emitter chung BC547</text><rect x="16" y="55" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="74" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">COLLECTOR</text><rect class="node" x="31" y="93" width="298" height="36" rx="8"/><text x="180" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">+12 V</text><path class="wire" d="M180 129 v13"/><path d="M175 137 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="147" width="298" height="36" rx="8"/><text x="180" y="170" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">R_C 4,7 kΩ</text><path class="wire" d="M180 183 v13"/><path d="M175 191 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="201" width="298" height="36" rx="8"/><text x="180" y="224" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">C • BC547</text><path class="wire" d="M180 237 v13"/><path d="M175 245 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="255" width="298" height="36" rx="8"/><text x="180" y="278" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">C_out 10 µF → Vout</text><rect x="16" y="304" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="323" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">BASE</text><rect class="node" x="31" y="342" width="298" height="36" rx="8"/><text x="180" y="365" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">+12 V → R1 150 kΩ → B</text><path class="wire" d="M180 378 v13"/><path d="M175 386 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="396" width="298" height="36" rx="8"/><text x="180" y="419" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vin → C_in 10 µF → B</text><path class="wire" d="M180 432 v13"/><path d="M175 440 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="450" width="298" height="36" rx="8"/><text x="180" y="473" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">B → R2 22 kΩ → GND</text><rect x="16" y="499" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="518" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">EMITTER</text><rect class="node" x="31" y="537" width="298" height="36" rx="8"/><text x="180" y="560" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">E → R_E 560 Ω → GND</text><path class="wire" d="M180 573 v13"/><path d="M175 581 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="591" width="298" height="36" rx="8"/><text x="180" y="614" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">C_E 47 µF song song R_E</text><rect x="16" y="640" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="659" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">ĐO RA</text><rect class="node" x="31" y="678" width="298" height="36" rx="8"/><text x="180" y="701" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vout so với GND</text><path class="wire" d="M180 714 v13"/><path d="M175 722 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="732" width="298" height="36" rx="8"/><text x="180" y="755" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Tải cần đường DC về GND</text></svg>