<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-labelledby="title desc"><title id="title">DHT22 rời 4 chân nhìn chính diện</title><desc id="desc">DHT22 cảm biến rời 4 chân, mặt lưới hướng về người xem, chân xuống dưới: 1 VCC, 2 DATA, 3 NC, 4 GND. Ví dụ cấp 3,3 V, DATA kéo lên 3,3 V qua 10 kΩ tới GPIO, pin 3 bỏ trống, GND chung. Module gắn PCB có thể có pinout và pull-up khác, phải đọc nhãn/datasheet module.</desc><rect width="360" height="365" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">DHT22 rời 4 chân nhìn chính diện</text><rect x="88" y="60" width="184" height="140" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><circle cx="124" cy="85" r="6" fill="#7dd3fc"/><circle cx="160" cy="85" r="6" fill="#7dd3fc"/><circle cx="196" cy="85" r="6" fill="#7dd3fc"/><circle cx="232" cy="85" r="6" fill="#7dd3fc"/><circle cx="124" cy="110" r="6" fill="#7dd3fc"/><circle cx="160" cy="110" r="6" fill="#7dd3fc"/><circle cx="196" cy="110" r="6" fill="#7dd3fc"/><circle cx="232" cy="110" r="6" fill="#7dd3fc"/><circle cx="124" cy="135" r="6" fill="#7dd3fc"/><circle cx="160" cy="135" r="6" fill="#7dd3fc"/><circle cx="196" cy="135" r="6" fill="#7dd3fc"/><circle cx="232" cy="135" r="6" fill="#7dd3fc"/><circle cx="124" cy="160" r="6" fill="#7dd3fc"/><circle cx="160" cy="160" r="6" fill="#7dd3fc"/><circle cx="196" cy="160" r="6" fill="#7dd3fc"/><circle cx="232" cy="160" r="6" fill="#7dd3fc"/><text x="180" y="181" text-anchor="middle" font-size="12" fill="#075985" font-weight="700">mặt lưới hướng về bạn</text><path class="wire" d="M110 200 V250"/><text x="110" y="271" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">1</text><text x="110" y="292" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="700">VCC</text><path class="wire" d="M157 200 V250"/><text x="157" y="271" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">2</text><text x="157" y="292" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="700">DATA</text><path class="wire" d="M203 200 V250"/><text x="203" y="271" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">3</text><text x="203" y="292" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="700">NC</text><path class="wire" d="M250 200 V250"/><text x="250" y="271" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">4</text><text x="250" y="292" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="700">GND</text><text x="180" y="323" text-anchor="middle" font-size="12" fill="#334155" font-weight="700">DATA kéo lên VCC qua 10 kΩ</text><text x="180" y="344" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="500">PCB module: xem nhãn riêng</text></svg>