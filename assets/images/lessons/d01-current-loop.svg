<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 565" role="img" aria-labelledby="title desc">
  <title id="title">Chiều dòng điện quy ước và electron trong cùng mạch pin điện trở</title>
  <desc id="desc">Hai hình mạch kín giống nhau: nguồn pin ở nhánh trái, điện trở ở nhánh trên. Ở hình trên dòng điện quy ước đi từ cực dương phía trên qua điện trở sang phải, xuống rồi về cực âm. Ở hình dưới electron trong dây kim loại đi ngược lại từ cực âm qua nhánh dưới, lên rồi qua điện trở về cực dương.</desc>
  <defs><marker id="arrowA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5 1 8Z" fill="#67e8f9"/></marker></defs>
  <rect width="390" height="565" rx="18" fill="#10233b"/>
  <text x="20" y="36" fill="#f8fafc" font-family="Arial,sans-serif" font-size="19" font-weight="700">Một mạch, hai chiều mô tả</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#f8fafc" font-weight="700">
    <text x="20" y="72">1. Dòng điện quy ước: từ + đến −</text>
    <text x="20" y="332">2. Electron trong dây: từ − đến +</text>
  </g>
  <g stroke="#dbeafe" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 120H178M244 120H320V248H90V188M90 164V120"/>
    <path d="M178 120l8 -10 10 20 10 -20 10 20 10 -20 10 10h8"/>
    <path d="M59 164h62M74 188h32"/>
    <path d="M90 380H178M244 380H320V508H90V448M90 424V380"/>
    <path d="M178 380l8 -10 10 20 10 -20 10 20 10 -20 10 10h8"/>
    <path d="M59 424h62M74 448h32"/>
  </g>
  <g fill="#fbbf24" font-family="Arial,sans-serif" font-size="16" font-weight="700">
    <text x="45" y="161">+</text><text x="46" y="202">−</text>
    <text x="45" y="421">+</text><text x="46" y="462">−</text>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrowA)">
    <path d="M112 105H152"/><path d="M336 152V195"/><path d="M255 264H205"/>
    <path d="M111 524H160"/><path d="M336 468V422"/><path d="M299 365H261"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#cbd5e1">
    <text x="20" y="291">Dòng qua điện trở R ở nhánh trên sang phải.</text>
    <text x="20" y="552">Electron qua R ở nhánh trên sang trái.</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#f8fafc" font-weight="700"><text x="192" y="98">R</text><text x="192" y="358">R</text></g>
</svg>
