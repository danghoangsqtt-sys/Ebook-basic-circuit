<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" width="360" height="340" role="img" aria-labelledby="title desc"><title id="title">Cấu tạo và ký hiệu diode</title><desc id="desc">Cấu trúc P-N có vùng nghèo giữa hai bán dẫn; cực A nối phía P, cực K nối phía N. Ký hiệu mạch là tam giác hướng từ A sang K với vạch đứng ở phía K. Dòng quy ước đi từ A sang K khi phân cực thuận.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="360" height="340" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<path class="w" d="M40 100 H18 M300 100 H342 M30 250 H130 M180 250 H330"/>
<text x="180" y="28" class="h" text-anchor="middle">Cấu tạo diode và ký hiệu</text>
<circle cx="18" cy="100" r="4.5" class="c"/>
<circle cx="342" cy="100" r="4.5" class="c"/>
<text x="18" y="82" class="b">A</text>
<text x="342" y="82" class="b" text-anchor="end">K</text>
<rect x="40" y="65" width="100" height="70" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<rect x="140" y="65" width="60" height="70" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="200" y="65" width="100" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="90" y="108" class="h" text-anchor="middle">P</text>
<text x="250" y="108" class="h" text-anchor="middle">N</text>
<text x="170" y="156" class="m" text-anchor="middle">vùng nghèo</text>
<text x="170" y="172" class="m" text-anchor="middle">(rào thế)</text>
<path d="M130 232 V268 L180 250 Z" fill="#fff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path class="w" d="M180 232 V268"/>
<text x="30" y="226" class="b">A (anode)</text>
<text x="330" y="226" class="b" text-anchor="end">K (cathode)</text>
<path class="a" d="M55 288 L125 288" marker-end="url(#ah)"/>
<text x="180" y="292" class="m">dòng quy ước A → K</text>
<text x="180" y="318" class="m" text-anchor="middle">Vạch đứng ở phía K (cathode)</text>
</svg>
