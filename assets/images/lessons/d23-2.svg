<text x="14" y="270" class="m">1 START: SDA xuống khi SCL ở mức cao</text>
<text x="14" y="287" class="m">2 Địa chỉ 7 bit 0x3C = 0111100 (bit cao trước)</text>
<text x="14" y="304" class="m">3 R/W = 0: ghi     4 ACK: slave kéo SDA xuống</text>
<text x="14" y="321" class="m">5 Dữ liệu 0xAE = 10101110     6 ACK lần hai</text>
<text x="14" y="338" class="m">7 STOP: SDA lên khi SCL ở mức cao</text>
<text x="14" y="355" class="m">NACK: SDA vẫn cao ở xung ACK → thiết bị không nhận/lỗi</text>
</svg>
