text x="123" y="307" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">D3</text><g transform="translate(257 334) rotate(-50)"><rect x="-30" y="-14" width="60" height="28" fill="#f5f9fc"/><path d="M-30 0 H-12 M13 0 H30" stroke="#203f56" stroke-width="3"/><path d="M-12 -11 L11 0 L-12 11 Z" fill="#1766a1"/><path d="M13 -12 V12" stroke="#203f56" stroke-width="3"/></g><text x="257" y="307" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">D4</text><circle cx="190" cy="105" r="5" fill="#1766a1"/><text x="190" y="90" fill="#c23d3d" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">DC+</text><circle cx="65" cy="255" r="5" fill="#1766a1"/><text x="65" y="240" fill="#19344a" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">AC1</text><circle cx="315" cy="255" r="5" fill="#1766a1"/><text x="315" y="240" fill="#19344a" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">AC2</text><circle cx="190" cy="405" r="5" fill="#1766a1"/><text x="190" y="435" fill="#19344a" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">DC−</text><path d="M190 110 L190 209" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M190 209 L190 228" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="180" y="228" width="20" height="54" fill="white" stroke="#203f56" stroke-width="2"/><path d="M190 282 L190 291" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="206" y="260" fill="#19344a" font-size="14" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">R tải</text><path d="M190 291 L190 400" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="20" y="481" fill="#516779" font-size="14" font-weight="normal" text-anchor="start" font-family="Aria