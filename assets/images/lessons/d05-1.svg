<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" role="img" aria-labelledby="title desc">
  <title id="title">Ba điện trở mắc nối tiếp</title>
  <desc id="desc">Từ nút VCC đi qua R1 một kilô ôm, R2 hai kilô ôm, R3 ba kilô ôm theo một đường duy nhất rồi về GND. Dòng điện qua ba điện trở bằng nhau.</desc>
  <rect width="360" height="500" rx="18" fill="#10233b"/>
  <g fill="#f8fafc" font-family="Arial,sans-serif" font-weight="700"><text x="20" y="40" font-size="21">Mạch nối tiếp</text><text x="25" y="88" font-size="18">VCC</text><text x="25" y="455" font-size="18">GND / 0 V</text></g>
  <g fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linejoin="round"><path d="M170 80V116M170 173V223M170 280V330M170 387V449"/><rect x="143" y="116" width="54" height="57"/><rect x="143" y="223" width="54" height="57"/><rect x="143" y="330" width="54" height="57"/></g>
  <g fill="#67e8f9" font-family="Arial,sans-serif" font-size="18" font-weight="700"><text x="215" y="150">R1 = 1 kΩ</text><text x="215" y="257">R2 = 2 kΩ</text><text x="215" y="364">R3 = 3 kΩ</text></g>
  <g fill="#34d399"><circle cx="170" cy="80" r="5"/><circle cx="170" cy="449" r="5"/></g>
  <path d="M115 185V215m-8-9 8 9 8-9" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <text x="25" y="202" fill="#fbbf24" font-family="Arial,sans-serif" font-size="17" font-weight="700">I</text>
  <text x="20" y="480" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Một nhánh: I qua R1, R2, R3 bằng nhau.</text>
</svg>
