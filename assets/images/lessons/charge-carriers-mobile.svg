<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 670" role="img" aria-labelledby="title desc">
  <title id="title">Điện tích trong nguyên tử và electron dẫn trong kim loại</title>
  <desc id="desc">Sơ đồ khái niệm hai phần: vùng electron quanh hạt nhân dương và electron dẫn dịch chuyển giữa các ion kim loại cố định.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e38"/><stop offset="1" stop-color="#172d45"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#34d399" stop-opacity=".03"/><stop offset=".72" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity=".01"/></radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#67e8f9" stroke-width="2"/></marker>
  </defs>
  <rect width="390" height="670" rx="18" fill="url(#bg)"/>
  <text x="20" y="36" fill="#f8fafc" font-size="21" font-family="Arial,sans-serif" font-weight="700">Điện tích và electron dẫn</text>
  <rect x="14" y="60" width="362" height="265" rx="14" fill="#1e3a55" stroke="#54718a"/>
  <text x="28" y="90" fill="#f8fafc" font-size="17" font-family="Arial,sans-serif" font-weight="700">1. Trong nguyên tử</text>
  <circle cx="195" cy="190" r="82" fill="url(#cloud)" stroke="#34d399" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="195" cy="190" r="28" fill="#f59e0b"/><text x="195" y="198" fill="#111827" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="700">+</text>
  <circle cx="122" cy="166" r="15" fill="#34d399"/><text x="122" y="172" fill="#062a23" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">−</text>
  <circle cx="270" cy="166" r="15" fill="#34d399"/><text x="270" y="172" fill="#062a23" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">−</text>
  <circle cx="195" cy="268" r="15" fill="#34d399"/><text x="195" y="274" fill="#062a23" text-anchor="middle" font-size="19" font-family="Arial,sans-serif" font-weight="700">−</text>
  <text x="195" y="309" fill="#cbd5e1" text-anchor="middle" font-size="15" font-family="Arial,sans-serif">Vùng electron, không phải quỹ đạo tròn</text>
  <rect x="14" y="344" width="362" height="265" rx="14" fill="#1e3a55" stroke="#54718a"/>
  <text x="28" y="375" fill="#f8fafc" font-size="17" font-family="Arial,sans-serif" font-weight="700">2. Trong dây dẫn kim loại</text>
  <g fill="#fbbf24" stroke="#8a5a15" stroke-width="2">
    <circle cx="80" cy="427" r="16"/><circle cx="195" cy="427" r="16"/><circle cx="310" cy="427" r="16"/>
    <circle cx="80" cy="531" r="16"/><circle cx="195" cy="531" r="16"/><circle cx="310" cy="531" r="16"/>
  </g>
  <g fill="#1f2937" font-size="18" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="80" y="433">+</text><text x="195" y="433">+</text><text x="310" y="433">+</text>
    <text x="80" y="537">+</text><text x="195" y="537">+</text><text x="310" y="537">+</text>
  </g>
  <g fill="#34d399" font-size="23" font-weight="700" font-family="Arial,sans-serif"><text x="129" y="489">e⁻</text><text x="237" y="489">e⁻</text></g>
  <path d="M159 480h50M267 480h48" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="195" y="584" fill="#cbd5e1" text-anchor="middle" font-size="15" font-family="Arial,sans-serif">Ion cố định · electron dẫn dịch chuyển</text>
  <text x="20" y="642" fill="#94a3b8" font-size="15" font-family="Arial,sans-serif">Sơ đồ khái niệm, không đúng tỉ lệ.</text>
</svg>
