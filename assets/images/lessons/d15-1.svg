<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-labelledby="title desc"><title id="title">BC547 onsemi TO-92: sơ đồ chân và ký hiệu</title><desc id="desc">Mặt phẳng có chữ hướng về bạn, chân đi xuống: C (1), B (2), E (3). Ký hiệu NPN có mũi tên tại emitter hướng ra ngoài. Thứ tự chân chỉ áp dụng cho đúng onsemi BC547 TO-92.</desc><rect width="360" height="500" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">BC547 onsemi TO-92: sơ đồ chân và ký hiệu</text><rect x="112" y="61" width="136" height="76" rx="34" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="180" y="92" text-anchor="middle" font-size="18" fill="#1e3a8a" font-weight="700">BC547</text><text x="180" y="118" text-anchor="middle" font-size="12" fill="#1e3a8a" font-weight="500">mặt có chữ</text><path class="wire" d="M137 137 V197"/><text x="137" y="217" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">1</text><text x="137" y="237" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">C</text><path class="wire" d="M180 137 V197"/><text x="180" y="217" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">2</text><text x="180" y="237" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">B</text><path class="wire" d="M223 137 V197"/><text x="223" y="217" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">3</text><text x="223" y="237" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">E</text><text x="180" y="276" text-anchor="middle" font-size="13" fill="#334155" font-weight="500">Nhìn từ phía mặt phẳng</text><text x="180" y="295" text-anchor="middle" font-size="13" fill="#334155" font-weight="500">Chân hướng xuống</text><text x="180" y="331" text-anchor="middle" font-size="13" font-weight="700">Ký hiệu NPN</text><path d="M144 405 H178 M179 381 V430 M187 396 L232 362 V347 M187 415 L232 449 V468" fill="none" stroke="#334155" stroke-width="3"/><path d="M214 435 L233 449 L223 428" fill="#334155"/><text x="132" y="409" text-anchor="end" font-size="13">B</text><text x="241" y="355" font-size="13">C</text><text x="241" y="469" font-size="13">E</text><text x="180" y="492" text-anchor="middle" font-size="12">Mũi tên emitter hướng ra ngoài</text></svg>