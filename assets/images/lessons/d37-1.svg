<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc MQTT: publish, broker và subscribe</title><desc id="desc">ESP32 publish nhiệt độ lên topic home/room1/temperature tới broker; broker chuyển tin cho Dashboard/App đã subscribe. Thiết bị điều khiển publish lệnh lên home/room1/led/cmd; broker chuyển tin cho ESP32 đã subscribe topic đó.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="400" height="470" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<text x="200" y="26" class="h" text-anchor="middle">MQTT: mọi tin đi qua broker</text>
<rect class="p" x="10" y="150" width="90" height="100" rx="8"/>
<text x="55" y="195.5" class="b" text-anchor="middle">ESP32 /</text>
<text x="55" y="212.5" text-anchor="middle">cảm biến</text>
<rect class="y" x="155" y="150" width="90" height="100" rx="8"/>
<text x="200" y="195.5" class="b" text-anchor="middle">MQTT</text>
<text x="200" y="212.5" text-anchor="middle">Broker</text>
<rect class="z" x="300" y="60" width="90" height="70" rx="8"/>
<text x="345" y="90.5" class="b" text-anchor="middle">Dashboard</text>
<text x="345" y="107.5" text-anchor="middle">/ App</text>
<rect class="z" x="300" y="270" width="90" height="70" rx="8"/>
<text x="345" y="300.5" class="b" text-anchor="middle">Điều khiển</text>
<text x="345" y="317.5" text-anchor="middle">(app/web)</text>
<path class="a" d="M100 185 L155 185" marker-end="url(#ah)"/>
<path class="ao" d="M155 220 L100 220" marker-end="url(#ao)"/>
<path class="a" d="M245 170 L300 115" marker-end="url(#ah)"/>
<path class="ao" d="M300 295 L245 230" marker-end="url(#ao)"/>
<circle cx="127" cy="172" r="9" fill="#0f766e"/>
<text x="127" y="176" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">1</text>
<circle cx="272" cy="128" r="9" fill="#0f766e"/>
<text x="272" y="132" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">2</text>
<circle cx="272" cy="278" r="9" fill="#0f766e"/>
<text x="272" y="282" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">3</text>
<circle cx="127" cy="234" r="9" fill="#0f766e"/>
<text x="127" y="238" font-size="12" font-weight="700" text-anchor="middle" style="fill:#fff">4</text>
<text x="14" y="368" class="m">1 ESP32 publish home/room1/temperature = 25.3</text>
<text x="14" y="386" class="m">2 Broker chuyển tin cho Dashboard/App đã subscribe</text>
<text x="14" y="404" class="m">3 Điều khiển publish home/room1/led/cmd = ON/OFF</text>
<text x="14" y="422" class="m">4 Broker → ESP32 đã subscribe topic</text>
<text x="14" y="440" class="m">   home/room1/led/cmd</text>
<text x="14" y="458" class="m">Mũi tên chỉ hướng tin; đăng ký topic trước</text>
</svg>
