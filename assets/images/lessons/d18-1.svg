<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-labelledby="title desc"><title id="title">IRLZ44N TO-220 và hai loại transistor</title><desc id="desc">IRLZ44N Infineon TO-220 nhìn mặt chữ, chân hướng xuống: G (1), D (2), S (3); tab kim loại cũng là D. BJT NPN điều khiển bằng dòng base; NMOS điều khiển bởi điện áp VGS. RDS(on) IRLZ44N chỉ bảo đảm tại VGS được nêu trong datasheet, không có bảo đảm tại 3,3 V.</desc><rect width="360" height="365" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">IRLZ44N TO-220 và hai loại transistor</text><rect x="115" y="60" width="130" height="125" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><circle cx="180" cy="79" r="8" fill="none" stroke="#64748b" stroke-width="2"/><text x="180" y="119" text-anchor="middle" font-size="17" fill="#1e3a8a" font-weight="700">IRLZ44N</text><text x="180" y="143" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="500">TO-220</text><path class="wire" d="M140 185 V242"/><text x="140" y="262" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">1</text><text x="140" y="283" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">G</text><path class="wire" d="M180 185 V242"/><text x="180" y="262" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">2</text><text x="180" y="283" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">D</text><path class="wire" d="M220 185 V242"/><text x="220" y="262" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="700">3</text><text x="220" y="283" text-anchor="middle" font-size="17" fill="#0f766e" font-weight="700">S</text><text x="180" y="316" text-anchor="middle" font-size="14" fill="#b45309" font-weight="700">Tab kim loại = D</text><text x="180" y="340" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="700">RDS(on) chưa bảo đảm ở 3,3 V</text></svg>