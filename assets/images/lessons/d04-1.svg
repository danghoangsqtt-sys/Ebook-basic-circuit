<svg xmlns="http://www.w3.org/2000/svg" width="390" height="425" viewBox="0 0 390 425" role="img" aria-labelledby="title desc"><title id="title">D04-1 · Nhận biết LED 5 mm</title><desc id="desc">Hình gợi ý nhận biết cực, chiều anode tới cathode; cần đo kiểm nếu chân đã cắt.</desc><rect width="390" height="425" rx="18" fill="#f5f9fc"/><text x="20" y="35" font-size="19" font-weight="700" fill="#19344a" font-family="Arial,sans-serif">D04-1 · Nhận biết LED 5 mm</text><path d="M112 99 Q112 60 190 60 Q268 60 268 99 V186 H112 Z" fill="#dff0f8" stroke="#25475b" stroke-width="3"/><rect x="249" y="130" width="18" height="56" fill="#b5c1c7"/><path d="M146 186 L146 280" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M235 186 L235 250" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="146" y="307" fill="#c23d3d" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">A · chân dài</text><text x="235" y="277" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">K · chân ngắn</text><text x="190" y="121" fill="#19344a" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">LED</text><text x="190" y="155" fill="#516779" font-size="13" font-weight="normal" text-anchor="middle" font-family="Arial,sans-serif">mặt phẳng = K</text><path d="M95 345 L147 345" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><g transform="translate(190 345) rotate(0)"><rect x="-30" y="-14" width="60" height="28" fill="#f5f9fc"/><path d="M-30 0 H-12 M13 0 H30" stroke="#203f56" stroke-width="3"/><path d="M-12 -11 L11 0 L-12 11 Z" fill="#1766a1"/><path d="M13 -12 V12" stroke="#203f56" stroke-width="3"/></g><path d="M220 345 L285 345" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M215 319 L240 294" fill="none" stroke="#1766a1" stroke-width="2" stroke-linecap="round"/><path d="M230 327 L255 302" fill="none" stroke="#1766a1" stroke-width="2" stroke-linecap="round"/><path d="M233 294 L240 294 L240 301 Z M248 302 L255 302 L255 309 Z" fill="#1766a1"/><text x="86" y="374" fill="#c23d3d" font-size="14" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">A (+)</text><text x="281" y="374" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">K (−)</text><text x="20" y="408" fill="#516779" font-size="13" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">Ưu tiên xác định bằng chế độ diode của đồng hồ.</text></svg>
