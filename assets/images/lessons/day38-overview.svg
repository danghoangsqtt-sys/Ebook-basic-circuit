<text x="116" y="231" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Stepper</text>
<text x="56" y="278" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Driver A4988 nhận STEP/DIR,</text>
<text x="56" y="316" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">giới hạn dòng cuộn.</text>
