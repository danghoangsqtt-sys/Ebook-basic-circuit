<text x="116" y="879" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Nguồn</text>
<text x="56" y="926" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Cấp nguồn động cơ riêng đủ</text>
<text x="56" y="964" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">dòng, GND phù hợp.</text>
