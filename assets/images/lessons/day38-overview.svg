<text x="116" y="663" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Servo RC</text>
<text x="56" y="710" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Xung điều khiển vị trí</text>
<text x="56" y="748" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">thường quanh 1–2 ms.</text>
<rect x="29" y="822" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
