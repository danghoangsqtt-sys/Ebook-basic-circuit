<svg xmlns="http://www.w3.org/2000/svg" width="390" height="385" viewBox="0 0 390 385" role="img" aria-labelledby="title desc"><title id="title">D12-2 · Chia áp 5 V → GPIO</title><desc id="desc">Tín hiệu logic 5 V qua R1 10 kiloohm đến nút GPIO; R2 15 kiloohm từ nút về GND chung.</desc><rect width="390" height="385" rx="18" fill="#f5f9fc"/><text x="20" y="35" font-size="19" font-weight="700" fill="#19344a" font-family="Arial,sans-serif">D12-2 · Chia áp 5 V → GPIO</text><text x="20" y="99" fill="#c23d3d" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">5 V logic</text><path d="M100 94 L112 94" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M114 94 L123 94" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="123" y="84" width="54" height="20" fill="white" stroke="#203f56" stroke-width="2"/><path d="M177 94 L186 94" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="150" y="76" fill="#19344a" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">R1 10 kΩ</text><path d="M186 94 L300 94" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><circle cx="238" cy="94" r="5" fill="#1766a1"/><text x="301" y="99" fill="#19344a" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">GPIO</text><path d="M238 94 L238 144" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M238 144 L238 153" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="228" y="153" width="20" height="54" fill="white" stroke="#203f56" stroke-width="2"/><path d="M238 207 L238 216" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="254" y="185" fill="#19344a" font-size="14" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">R2 15 kΩ</text><path d="M238 216 L238 270" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M126 270 L320 270" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><circle cx="238" cy="270" r="5" fill="#1766a1"/><text x="20" y="275" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">GND chung</text><text x="20" y="323" fill="#19344a" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">Vgpio ≈ 5 × 15/(10+15) = 3,0 V</text><text x="20" y="349" fill="#516779" font-size="13" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">Tín hiệu chậm, một chiều; kiểm tra đúng chip.</text></svg>
