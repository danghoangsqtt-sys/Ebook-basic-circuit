<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Quy trình dự án LED bốn màu — Từ tính toán đến mạch chạy thật — Bài 7</title>
<desc id="desc">Dự án LED bốn màu; Tính R từng nhánh: Chọn dòng và đo Vf từng màu.; Lắp bốn nhánh: Mỗi LED có R riêng; kiểm GND.; Kiểm trước khi nạp: Đo thông mạch và tìm chập nguồn.; Chạy và đo lại: Thử firmware, đo từng nhánh.</desc>
