<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Lập bản thiết kế đồ án tốt nghiệp nhúng toàn diện — Bài 43</title>
<desc id="desc">Ý tưởng dự án nhúng; Yêu cầu: Viết FR/NFR và cách kiểm.; Kiến trúc: Vẽ khối và giao tiếp thực.; Nguồn lực: Lập BOM và ngân sách.; Lịch làm: Chia thiết kế, lắp và thử.</desc>
