<text x="300" y="556" class="m" text-anchor="middle">GND 12 V</text>
<text x="180" y="584" class="m" text-anchor="middle">Dòng quạt chỉ qua tiếp điểm relay, không qua LM358 hay BC337</text>
</svg>
