<rect class="c" x="227" y="70" width="26" height="45" rx="4"/>
<text x="222" y="88" class="m" text-anchor="end">Cuộn relay</text>
<text x="222" y="104" class="m" text-anchor="end">≤ 25 mA</text>
<path d="M278 114.5 H302 L290 94.5 Z" fill="#fff" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>
<path class="w" d="M278 94.5 H302"/>
<text x="306" y="106" class="m">1N4007</text>
<circle cx="240" cy="150" r="4.5" class="n"/>
<path class="k" d="M205 195 V235"/>
<path class="w" d="M205 205 L240 187"/>
<path class="w" marker-end="url(#ad)" d="M205 225 L240 243"/>
<text x="120" y="255" class="b" text-anchor="middle">BC337</text>
<text x="120" y="271" class="m" text-anchor="middle">(NPN)</text>
<text x="188" y="207" class="s" text-anchor="end">B</text>
<text x="247" y="182" class="s">C</text>
<text x="247" y="250" class="s">E</text>
