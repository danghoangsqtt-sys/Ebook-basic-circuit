<text x="20" y="346" class="b">B. LED đỏ chỉ thị nhiệt cao</text>
<circle cx="30" cy="390" r="4.5" class="c"/>
<text x="30" y="374" class="b">OUT</text>
<rect class="c" x="70" y="377" width="55" height="26" rx="4"/>
