<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Điện tích trong nguyên tử và electron dẫn trong kim loại</title>
  <desc id="desc">Bên trái là hạt nhân dương cùng vùng electron âm, được ghi rõ là mô hình khái niệm, không phải quỹ đạo tròn. Bên phải là mạng ion kim loại cố định và các electron dẫn có thể dịch chuyển.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e38"/><stop offset="1" stop-color="#172d45"/></linearGradient>
    <radialGradient id="cloud"><stop stop-color="#34d399" stop-opacity=".03"/><stop offset=".72" stop-color="#34d399" stop-opacity=".13"/><stop offset="1" stop-color="#34d399" stop-opacity=".01"/></radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#67e8f9" stroke-width="2"/></marker>
  </defs>
  <rect width="960" height="450" rx="24" fill="url(#bg)"/>
  <text x="42" y="53" fill="#f8fafc" font-size="25" font-family="Arial,sans-serif" font-weight="700">Điện tích và electron dẫn</text>
  <line x1="478" y1="82" x2="478" y2="397" stroke="#426078" stroke-width="2"/>
  <text x="42" y="105" fill="#cbd5e1" font-size="19" font-family="Arial,sans-serif">1. Trong nguyên tử</text>
  <circle cx="238" cy="234" r="127" fill="url(#cloud)" stroke="#34d399" stroke-width="2" stroke-dasharray="7 8"/>
  <circle cx="238" cy="234" r="38" fill="#f59e0b"/>
  <text x="238" y="242" fill="#111827" text-anchor="middle" font-size="25" font-family="Arial,sans-serif" font-weight="700">+</text>
  <circle cx="128" cy="191" r="17" fill="#34d399"/><text x="128" y="197" fill="#062a23" text-anchor="middle" font-size="19" font-weight="700" font-family="Arial,sans-serif">−</text>
  <circle cx="349" cy="190" r="17" fill="#34d399"/><text x="349" y="196" fill="#062a23" text-anchor="middle" font-size="19" font-weight="700" font-family="Arial,sans-serif">−</text>
  <circle cx="251" cy="351" r="17" fill="#34d399"/><text x="251" y="357" fill="#062a23" text-anchor="middle" font-size="19" font-weight="700" font-family="Arial,sans-serif">−</text>
  <text x="238" y="393" fill="#cbd5e1" text-anchor="middle" font-size="17" font-family="Arial,sans-serif">Vùng electron — không phải quỹ đạo tròn</text>
  <text x="520" y="105" fill="#cbd5e1" font-size="19" font-family="Arial,sans-serif">2. Trong dây dẫn kim loại</text>
  <rect x="528" y="135" width="387" height="199" rx="17" fill="#1e3a55" stroke="#54718a" stroke-width="2"/>
  <g fill="#fbbf24" stroke="#8a5a15" stroke-width="2">
    <circle cx="585" cy="180" r="18"/><circle cx="710" cy="180" r="18"/><circle cx="835" cy="180" r="18"/>
    <circle cx="585" cy="285" r="18"/><circle cx="710" cy="285" r="18"/><circle cx="835" cy="285" r="18"/>
  </g>
  <g fill="#1f2937" font-size="19" font-weight="700" font-family="Arial,sans-serif" text-anchor="middle">
    <text x="585" y="187">+</text><text x="710" y="187">+</text><text x="835" y="187">+</text>
    <text x="585" y="292">+</text><text x="710" y="292">+</text><text x="835" y="292">+</text>
  </g>
  <g fill="#34d399" font-size="25" font-weight="700" font-family="Arial,sans-serif"><text x="630" y="238">e⁻</text><text x="754" y="238">e⁻</text></g>
  <path d="M662 231h64M786 231h52" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="720" y="369" fill="#cbd5e1" text-anchor="middle" font-size="17" font-family="Arial,sans-serif">Ion kim loại cố định · electron dẫn dịch chuyển</text>
  <text x="42" y="428" fill="#94a3b8" font-size="15" font-family="Arial,sans-serif">Sơ đồ khái niệm, không đúng tỉ lệ kích thước hoặc vị trí hạt.</text>
</svg>
