<text x="66" y="230" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">1</text>
<text x="116" y="231" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Setpoint</text>
<text x="56" y="278" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Giá trị mong muốn so với số</text>
<text x="56" y="316" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">đo phản hồi.</text>
<path d="M 280 375 v 12" stroke="#78e6da" stroke-width="4" stroke-linecap="round"/>
<path d="M 272 383 l 8 8 8 -8" fill="none" stroke="#78e6da" stroke-width="4"/>
<rect x="29" y="390" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="390" width="7" height="200" rx="3" fill="#f5bd6a"/>
<circle cx="77" cy="437" r="24" fill="#f5bd6a"/>
<text x="66" y="446" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">2</text>
<text x="116" y="447" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Sai số e</text>
<text x="56" y="494" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">e = setpoint − measurement</text>
<text x="56" y="532" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">ở mỗi chu kỳ.</text>
<path d="M 280 591 v 12" stroke="#78e6da" stroke-width="4" stroke-linecap="round"/>
<path d="M 272 599 l 8 8 8 -8" fill="none" stroke="#78e6da" stroke-width="4"/>
<rect x="29" y="606" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="606" width="7" height="200" rx="3" fill="#9cb7ff"/>
<circle cx="77" cy="653" r="24" fill="#9cb7ff"/>
<text x="66" y="662" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">3</text>
<text x="116" y="663" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Bộ PID</text>
<text x="56" y="710" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">P phản ứng, I cộng sai số,</text>
<text x="56" y="748" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">D nhìn tốc độ đổi.</text>
<path d="M 280 807 v 12" stroke="#78e6da" stroke-width="4" stroke-linecap="round"/>
<path d="M 272 815 l 8 8 8 -8" fill="none" stroke="#78e6da" stroke-width="4"/>
<rect x="29" y="822" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="822" width="7" height="200" rx="3" fill="#e7a2cb"/>
<circle cx="77" cy="869" r="24" fill="#e7a2cb"/>
<text x="66" y="878" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">4</text>
<text x="116" y="879" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Đầu ra và hồi tiếp</text>
<text x="56" y="926" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Giới hạn lệnh, điều khiển</text>
<text x="56" y="964" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">tải, đo lại hệ.</text>
<rect x="29" y="1040" width="502" height="54" rx="16" fill="#25415b"/>
<text x="47" y="1076" fill="#f8fafc" font-size="27" font-weight="700" font-family="Arial, sans-serif">Tính dt và chống bão hòa tích phân</text>
</svg>
