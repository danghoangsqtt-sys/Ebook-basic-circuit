<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1114" viewBox="0 0 560 1114" role="img" aria-labelledby="title desc">
<title id="title">Vòng điều khiển PID — Bài 51</title>
<desc id="desc">Tính dt và chống bão hòa tích phân</desc>
<rect width="560" height="1114" rx="24" fill="#101b2d"/>
<rect x="28" y="26" width="96" height="42" rx="21" fill="#25415b"/>
<text x="47" y="55" fill="#f8fafc" font-size="24" font-weight="700" font-family="Arial, sans-serif">BÀI 51</text>
<text x="400" y="55" fill="#9ebbd0" font-size="20" font-weight="700" font-family="Arial, sans-serif">QUY TRÌNH</text>
<text x="32" y="113" fill="#f8fafc" font-size="36" font-weight="700" font-family="Arial, sans-serif">Vòng điều khiển PID</text>
<rect x="29" y="174" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="174" width="7" height="200" rx="3" fill="#54d6c9"/>
