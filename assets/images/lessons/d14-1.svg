<svg xmlns="http://www.w3.org/2000/svg" width="390" height="805" viewBox="0 0 390 805" role="img" aria-labelledby="title desc"><title id="title">D14-1 · Nguồn DC hai mức</title><desc id="desc">Sơ đồ nút hai tầng. 9 V DC qua diode bảo vệ, LM7805 tạo 5 V; 5 V cấp AMS1117 tạo 3,3 V. Các tụ và điện trở LED là nhánh xuống GND chung.</desc><rect width="390" height="805" rx="18" fill="#f5f9fc"/><text x="20" y="36" font-family="Arial,sans-serif" font-size="19" fill="#19344a" font-weight="bold">D14-1 · Nguồn DC hai mức</text><text x="20" y="73" font-family="Arial,sans-serif" font-size="15" fill="#c23d3d" font-weight="bold">Tầng 1 · nguồn 9 V DC cách ly</text><rect x="20" y="99" width="70" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="126.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">9 V +</text><path d="M90 121 L104 121" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="104" y="99" width="92" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="112" y="126.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">Dprot A→K</text><path d="M196 121 L209 121" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="209" y="99" width="91" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="217" y="126.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">LM7805</text><path d="M300 121 L314 121" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="314" y="99" width="66" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="322" y="126.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+5 V</text><text x="20" y="179" font-family="Arial,sans-serif" font-size="14" fill="#516779" font-weight="normal">Nhánh xuống GND chung:</text><rect x="20" y="199" width="350" height="43" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="225.5" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">VIN_REG → C1 ∥ C2 → GND</text><rect x="20" y="251" width="350" height="43" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="277.5" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+5 V → C3 ∥ C4 → GND</text><rect x="20" y="303" width="350" height="43" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="329.5" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+5 V → R330 → LED đỏ → GND</text><path d="M24 365 L366 365" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="25" y="388" font-family="Arial,sans-serif" font-size="13" fill="#1766a1" font-weight="bold">GND tầng 1 = GND tầng 2</text><text x="20" y="439" font-family="Arial,sans-serif" font-size="15" fill="#c23d3d" font-weight="bold">Tầng 2 · từ rail +5 V ở trên</text><rect x="20" y="463" width="92" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="490.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+5 V</text><path d="M112 485 L149 485" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="149" y="463" width="133" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="157" y="490.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">AMS1117-3.3</text><path d="M282 485 L301 485" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="301" y="463" width="79" height="44" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="309" y="490.0" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+3,3 V</text><text x="20" y="544" font-family="Arial,sans-serif" font-size="14" fill="#516779" font-weight="normal">Nhánh xuống GND chung:</text><rect x="20" y="565" width="350" height="43" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="591.5" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+3,3 V → C5 ∥ C6 → GND</text><rect x="20" y="619" width="350" height="43" rx="7" fill="#e7f0f8" stroke="#203f56" stroke-width="2"/><text x="28" y="645.5" font-family="Arial,sans-serif" font-size="13" fill="#19344a" font-weight="bold">+3,3 V → R150 → LED xanh → GND</text><path d="M24 690 L366 690" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="25" y="714" font-family="Arial,sans-serif" font-size="13" fill="#1766a1" font-weight="bold">GND · chung cho cả hai tầng</text><text x="20" y="759" font-family="Arial,sans-serif" font-size="13" fill="#516779" font-weight="normal">Đây là sơ đồ nút, không phải sơ đồ chân IC.</text><text x="20" y="780" font-family="Arial,sans-serif" font-size="13" fill="#c23d3d" font-weight="normal">Tra datasheet trước khi lắp mạch thật.</text></svg>
