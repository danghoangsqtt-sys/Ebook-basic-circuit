<desc id="desc">Cảm biến → ESP32 → hiển thị/log; Đọc cảm biến: Nhận nhiệt, ẩm; kiểm dữ liệu.; ESP32 xử lý: Đọc định kỳ và phát hiện lỗi.; Hiển thị và ghi: OLED và SD theo bus phù hợp.; Đối chiếu số đo: Ghi bảng kiểm và sai lệch.</desc>
