<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="title desc"><title id="title">Cầu H điều khiển motor</title><desc id="desc">Bốn công tắc Q1 Q2 Q3 Q4 tạo hai nhánh cầu H. Q1 và Q4 dẫn cho dòng từ A qua motor sang B; Q2 và Q3 dẫn đảo chiều. Không đóng cùng lúc hai công tắc trên cùng một nhánh.</desc><rect width="400" height="560" rx="16" fill="#10233b"/>
<text x="20" y="38" fill="#f8fafc" font-family="Arial,sans-serif" font-size="20" font-weight="700">Cầu H điều khiển motor</text>
<text x="20" y="65" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">Mô hình công tắc lý tưởng; driver thực</text>
<text x="20" y="85" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">cần bảo vệ và thời gian chết.</text>
<line x1="75" y1="128" x2="330" y2="128" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<text x="20" y="133" fill="#34d399" font-family="Arial,sans-serif" font-size="14" font-weight="700">VM+</text>
<rect x="93" y="163" width="70" height="48" rx="8" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
<text x="128.0" y="192.0" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q1</text>
<rect x="252" y="163" width="70" height="48" rx="8" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
<text x="287.0" y="192.0" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q3</text>
<line x1="128" y1="128" x2="128" y2="163" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<line x1="287" y1="128" x2="287" y2="163" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<line x1="128" y1="211" x2="128" y2="273" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
