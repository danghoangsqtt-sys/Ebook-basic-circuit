<rect x="93" y="329" width="70" height="48" rx="8" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
<text x="128.0" y="358.0" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q2</text>
<rect x="252" y="329" width="70" height="48" rx="8" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
<text x="287.0" y="358.0" fill="#f8fafc" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q4</text>
<line x1="128" y1="377" x2="128" y2="413" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<line x1="287" y1="377" x2="287" y2="413" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<line x1="75" y1="413" x2="330" y2="413" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<text x="20" y="418" fill="#34d399" font-family="Arial,sans-serif" font-size="14" font-weight="700">GND</text>
<text x="20" y="458" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="14" font-weight="400">Tiến: Q1 + Q4. Lùi: Q2 + Q3.</text>
<text x="20" y="483" fill="#fca5a5" font-family="Arial,sans-serif" font-size="14" font-weight="700">Cấm Q1+Q2 hoặc Q3+Q4: chập nguồn.</text>
<text x="20" y="509" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13" font-weight="400">Coast: tất cả tắt. Brake: hai nhánh thấp bật</text>
<text x="20" y="531" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="13" font-weight="400">(tuỳ trạng thái driver và đường hồi dòng).</text>
</svg>
