<circle cx="128" cy="273" r="5" fill="#34d399"/>
<circle cx="287" cy="273" r="5" fill="#34d399"/>
<line x1="128" y1="273" x2="160" y2="273" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<rect x="160" y="248" width="95" height="50" rx="8" fill="#1e3a5f" stroke="#93c5fd" stroke-width="2"/>
<text x="207.5" y="278.3333333333333" fill="#f8fafc" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">MOTOR</text>
<line x1="255" y1="273" x2="287" y2="273" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
<text x="106" y="250" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="700">A</text>
<text x="298" y="250" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" font-weight="700">B</text>
<line x1="128" y1="273" x2="128" y2="329" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
