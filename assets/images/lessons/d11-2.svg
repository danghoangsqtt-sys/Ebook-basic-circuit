<svg xmlns="http://www.w3.org/2000/svg" width="390" height="355" viewBox="0 0 390 355" role="img" aria-labelledby="title desc"><title id="title">D11-2 · Chỉnh lưu bán sóng</title><desc id="desc">Nguồn AC thấp áp cách ly: AC1 qua anode diode, cathode về DC+; tải từ DC+ về AC2.</desc><rect width="390" height="355" rx="18" fill="#f5f9fc"/><text x="20" y="35" font-size="19" font-weight="700" fill="#19344a" font-family="Arial,sans-serif">D11-2 · Chỉnh lưu bán sóng</text><text x="20" y="103" fill="#19344a" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">AC1</text><path d="M66 98 L145 98" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><g transform="translate(175 98) rotate(0)"><rect x="-30" y="-14" width="60" height="28" fill="#f5f9fc"/><path d="M-30 0 H-12 M13 0 H30" stroke="#203f56" stroke-width="3"/><path d="M-12 -11 L11 0 L-12 11 Z" fill="#1766a1"/><path d="M13 -12 V12" stroke="#203f56" stroke-width="3"/></g><text x="175" y="77" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">D1</text><path d="M205 98 L291 98" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><circle cx="291" cy="98" r="5" fill="#1766a1"/><text x="300" y="103" fill="#c23d3d" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">DC+</text><path d="M291 98 L291 150" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M291 152 L291 161" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="281" y="161" width="20" height="54" fill="white" stroke="#203f56" stroke-width="2"/><path d="M291 215 L291 224" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="307" y="193" fill="#19344a" font-size="14" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">R tải</text><path d="M291 224 L291 282" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="20" y="290" fill="#19344a" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">AC2</text><path d="M66 282 L291 282" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><circle cx="291" cy="282" r="5" fill="#1766a1"/><text x="300" y="288" fill="#1766a1" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">DC−</text><text x="20" y="333" fill="#516779" font-size="14" font-weight="normal" text-anchor="start" font-family="Arial,sans-serif">AC1 dương: A → K → tải → AC2.</text></svg>
