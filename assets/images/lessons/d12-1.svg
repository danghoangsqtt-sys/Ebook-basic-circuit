<svg xmlns="http://www.w3.org/2000/svg" width="390" height="420" viewBox="0 0 390 420" role="img" aria-labelledby="title desc"><title id="title">D12-1 · Zener ổn áp song song</title><desc id="desc">Vin qua điện trở Rs đến Vout; Zener cathode nối Vout, anode nối GND; tải cũng từ Vout tới GND.</desc><rect width="390" height="420" rx="18" fill="#f5f9fc"/><text x="20" y="35" font-size="19" font-weight="700" fill="#19344a" font-family="Arial,sans-serif">D12-1 · Zener ổn áp song song</text><text x="20" y="116" fill="#c23d3d" font-size="15" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">Vin+</text><path d="M60 110 L92 110" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><path d="M94 110 L103 110" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><rect x="103" y="100" width="54" height="20" fill="white" stroke="#203f56" stroke-width="2"/><path d="M157 110 L166 110" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><text x="130" y="92" fill="#19344a" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial,sans-serif">Rs</text><path d="M166 110 L320 110" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><circle cx="217" cy="110" r="5" fill="#1766a1"/><circle cx="320" cy="110" r="5" fill="#1766a1"/><text x="275" y="84" fill="#c23d3d" font-size="14" font-weight="bold" text-anchor="start" font-family="Arial,sans-serif">Vout ≈ Vz</text><path d="M217 110 L217 180" fill="none" stroke="#203f56" stroke-width="3" stroke-linecap="round"/><g transform="translate(217 212) rotate(-90)"><rect x="-30" y="-14" width="60" height="28" fill="#f5f9fc"/><path d="M-30 0 H-12 M13 0 H30" stroke="#203f56" stroke-width="3"/><path d="M-12 -11 L11 0 L-12 11 Z" fill="#1766a1"/><path d="M13 -12 V12 M13 -12 l-7 -5 M13 12 l7 5" fill="none" stroke="#203f56" stroke-width="3"/></g><text x="217" y="191" fill="#1766a1" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial