<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-labelledby="title desc"><title id="title">I²C: SDA và SCL riêng</title><desc id="desc">ESP32, OLED và BME280 dùng chung net SDA và net SCL riêng. Mỗi net kéo lên 3,3 V qua điện trở phù hợp. GND chung. Kiểm mức nguồn, pull-up đã có trên module và điện dung bus.</desc><rect width="360" height="480" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">I²C: SDA và SCL riêng</text>
