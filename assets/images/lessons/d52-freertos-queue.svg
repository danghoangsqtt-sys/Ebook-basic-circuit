<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Mô hình đa tác vụ và hàng đợi Queue đồng bộ trong FreeRTOS — Bài 52</title>
<desc id="desc">Task Cảm biến Producer → Hàng đợi FreeRTOS Queue → Task Hiển thị Consumer → Kernel lập lịch Preemptive → Hardware WDT</desc>
<rect width="960" height="280" rx="16" fill="#0d1829" stroke="#1e293b" stroke-width="1.5"/>
<rect x="24" y="18" width="912" height="48" rx="8" fill="#14243b" stroke="#253a56" stroke-width="1"/>
<rect x="34" y="26" width="180" height="32" rx="6" fill="#1e3a5f"/>
<text x="124" y="47" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">BÀI 52 · ĐA NHIỆM FREERTOS</text>
<text x="229" y="48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Mô hình đa tác vụ và hàng đợi Queue đồng bộ trong FreeRTOS</text>
<rect x="24" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 25 91 Q 25 86 30 86 L 179 86 Q 184 86 184 91 L 184 91 L 25 91 Z" fill="#38bdf8"/>
<rect x="34" y="99" width="26" height="20" rx="4" fill="#0284c7"/>
<text x="47" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
<text x="66" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Task Cảm biến</text>
<line x1="34" y1="127" x2="175" y2="127" stroke="#253852" stroke-width="1"/>
<text x="34" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Tác vụ chu kỳ độ ưu</text>
<text x="34" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tiên cao đọc cảm biến,</text>
<text x="34" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">đóng gói dữ liệu và</text>
<text x="34" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">gửi vào Queue.</text>
<path d="M 190 172 L 204 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 200 168 L 205 172 L 200 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="211" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 212 91 Q 212 86 217 86 L 366 86 Q 371 86 371 91 L 371 91 L 212 91 Z" fill="#34d399"/>
<rect x="221" y="99" width="26" height="20" rx="4" fill="#059669"/>
<text x="234" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="253" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">FreeRTOS Queue</text>
<line x1="221" y1="127" x2="362" y2="127" stroke="#253852" stroke-width="1"/>
<text x="221" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Vùng đệm hàng đợi</text>
<text x="221" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">FIFO an toàn luồng</text>
<text x="221" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">(thread-safe), ngăn</text>
<text x="221" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">ngừa tranh chấp bộ</text>
<text x="221" y="227" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">nhớ.</text>
<path d="M 377 172 L 391 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 387 168 L 392 172 L 387 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="398" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 399 91 Q 399 86 404 86 L 553 86 Q 558 86 558 91 L 558 91 L 399 91 Z" fill="#fbbf24"/>
<rect x="408" y="99" width="26" height="20" rx="4" fill="#d97706"/>
<text x="421" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<text x="440" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Task Hiển thị</text>
<line x1="408" y1="127" x2="549" y2="127" stroke="#253852" stroke-width="1"/>
<text x="408" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Tác vụ độ ưu tiên</text>
<text x="408" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">thấp lấy dữ liệu từ</text>
<text x="408" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Queue, vẽ màn hình</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">OLED và gửi tin qua</text>
<text x="408" y="227" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">mạng.</text>
<path d="M 564 172 L 578 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 574 168 L 579 172 L 574 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="585" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 586 91 Q 586 86 591 86 L 740 86 Q 745 86 745 91 L 745 91 L 586 91 Z" fill="#a78bfa"/>
<rect x="595" y="99" width="26" height="20" rx="4" fill="#7c3aed"/>
<text x="608" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<text x="627" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Bộ lập lịch Kernel</text>
<line x1="595" y1="127" x2="736" y2="127" stroke="#253852" stroke-width="1"/>
<text x="595" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Điều phối thực thi</text>
<text x="595" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">theo mức ưu tiên</text>
<text x="595" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Preemptive; chuyển ngữ</text>
<text x="595" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">cảnh mượt mà giữa 2</text>
<text x="595" y="227" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">nhân.</text>
<path d="M 751 172 L 765 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 761 168 L 766 172 L 761 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="772" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 773 91 Q 773 86 778 86 L 927 86 Q 932 86 932 91 L 932 91 L 773 91 Z" fill="#f472b6"/>
<rect x="782" y="99" width="26" height="20" rx="4" fill="#db2777"/>
<text x="795" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<text x="814" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Giám sát Watchdog</text>
<line x1="782" y1="127" x2="923" y2="127" stroke="#253852" stroke-width="1"/>
<text x="782" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Mỗi task định kỳ nạp</text>
<text x="782" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">lại Task Watchdog</text>
<text x="782" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Timer (TWDT) để tự</text>
<text x="782" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">khởi động lại nếu</text>
<text x="782" y="227" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">treo.</text>
</svg>
