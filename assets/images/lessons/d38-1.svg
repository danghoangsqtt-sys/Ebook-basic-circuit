<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" role="img" aria-labelledby="title desc"><title id="title">A4988 carrier Pololu</title><desc id="desc">Sơ đồ kết nối logic cho carrier A4988 Pololu product 1182; nguồn logic VDD, nguồn motor VMOT, tụ gần VMOT, cuộn A vào 1A 1B, cuộn B vào 2A 2B, nối mass chung.</desc><rect width="400" height="640" rx="16" fill="#10233b"/>
