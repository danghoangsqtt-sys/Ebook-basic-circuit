<text x="440" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Chọn phân tích</text>
<line x1="408" y1="127" x2="549" y2="127" stroke="#253852" stroke-width="1"/>
<text x="408" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Thiết lập lệnh mô</text>
<text x="408" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">phỏng: .tran (thời</text>
<text x="408" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">gian), .ac (tần số)</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">hoặc .dc (quét áp).</text>
