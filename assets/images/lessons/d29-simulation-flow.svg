<text x="66" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Vẽ sơ đồ mạch</text>
<line x1="34" y1="127" x2="175" y2="127" stroke="#253852" stroke-width="1"/>
<text x="34" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Đặt linh kiện nguồn,</text>
<text x="34" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">RLC, IC bán dẫn và nối</text>
<text x="34" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">dây có đặt tên net rõ</text>
<text x="34" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">ràng.</text>
