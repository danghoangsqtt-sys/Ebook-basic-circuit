<text x="124" y="47" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">BÀI 29 · QUY TRÌNH MÔ PHỎNG</text>
<text x="229" y="48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Lưu đồ quy trình mô phỏng mạch điện chuyên nghiệp (SPICE)</text>
<rect x="24" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 25 91 Q 25 86 30 86 L 179 86 Q 184 86 184 91 L 184 91 L 25 91 Z" fill="#38bdf8"/>
