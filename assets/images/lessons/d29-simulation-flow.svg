<text x="253" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Gán mô hình SPICE</text>
<line x1="221" y1="127" x2="362" y2="127" stroke="#253852" stroke-width="1"/>
<text x="221" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Khai báo thông số</text>
<text x="221" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">linh kiện và nạp file</text>
<text x="221" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">model .subckt chính</text>
<text x="221" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">xác từ hãng.</text>
