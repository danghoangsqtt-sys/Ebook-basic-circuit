<circle cx="77" cy="437" r="24" fill="#54d6c9"/>
<text x="66" y="446" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">2</text>
<text x="116" y="447" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Không đảo</text>
<text x="56" y="494" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Tín hiệu vào chân +; Av ≈ 1</text>
<text x="56" y="532" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">+ Rf/Rg.</text>
