<text x="66" y="878" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">4</text>
<text x="116" y="879" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Comparator</text>
<text x="56" y="926" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Không hồi tiếp âm; so hai</text>
<text x="56" y="964" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">ngưỡng, ra bão hòa.</text>
