<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" aria-labelledby="title desc"><title id="title">NMOS kéo thấp cho motor DC</title><desc id="desc">Nguồn motor nối tới motor và cathode diode. Motor tới drain và anode diode. Source về GND chung. Gate từ GPIO qua điện trở 100 ohm, kéo xuống source qua 10 kiloohm. IRLZ44N không có bảo đảm RDS(on) tại 3,3 V.</desc><rect width="360" height="520" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">NMOS kéo thấp cho motor DC</text>
<path class="w" d="M99 85 H262 M99 85 V121 M99 203 V256 H262 M262 85 V144 M262 204 V256 M99 256 V284 M99 350 V408 H262"/>
<text x="180" y="76" text-anchor="middle" font-size="15" font-weight="700">+V_motor</text><rect class="c" x="58" y="121" width="82" height="82" rx="40"/><text x="99" y="158" text-anchor="middle" font-size="13">Motor</text><text x="99" y="177" text-anchor="middle" font-size="13">DC</text>
<path d="M239 185 L285 185 L262 145 Z" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M238 143 H286" stroke="#92400e" stroke-width="4"/><text x="298" y="151" font-size="12" font-weight="700">K</text><text x="298" y="204" font-size="12" font-weight="700">A</text><text x="262" y="229" text-anchor="middle" font-size="12">flyback</text>
<circle cx="99" cy="256" r="4" class="n"/><text x="140" y="253" font-size="12">nút D</text>
<rect x="64" y="284" width="70" height="66" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="99" y="307" text-anchor="middle" font-size="13" font-weight="700">NMOS</text><text x="99" y="333" text-anchor="middle" font-size="12">D G S</text>
