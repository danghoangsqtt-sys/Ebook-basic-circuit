<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" aria-labelledby="title desc"><title id="title">BC547 kéo thấp cho LED</title><desc id="desc">+5 V qua điện trở 270 ohm và LED anode đến cathode tới collector BC547. Emitter nối GND. GPIO 3,3 V qua điện trở base 2,7 kiloohm vào base. GND chung.</desc><rect width="360" height="430" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">BC547 kéo thấp cho LED</text>
<path class="w" d="M111 69 V100 M111 143 V163 M111 205 V248 M111 315 V355 H312 "/>
<text x="111" y="65" text-anchor="middle" font-size="14" font-weight="700">+5 V</text>
<rect class="c" x="76" y="101" width="70" height="42" rx="7"/><text x="111" y="126" text-anchor="middle" font-size="13">R_C 270 Ω</text>
<rect class="c" x="77" y="164" width="68" height="41" rx="7"/><text x="111" y="190" text-anchor="middle" font-size="14">LED A→K</text>
<rect x="78" y="249" width="66" height="66" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="111" y="274" text-anchor="middle" font-size="13" font-weight="700">BC547</text><text x="111" y="298" text-anchor="middle" font-size="12">C  B  E</text>
<path class="w" d="M3 282 H16 M68 282 H78"/><rect class="c" x="16" y="264" width="52" height="36" rx="6"/><text x="42" y="286" text-anchor="middle" font-size="11">R_B</text><text x="35" y="240" font-size="11">GPIO 3,3 V</text><text x="35" y="336" font-size="12">R_B = 2,7 kΩ</text>
<circle cx="111" cy="355" r="4" class="n"/><text x="179" y="377" text-anchor="middle" font-size="13" font-weight="700">GND chung nguồn và GPIO</text><text x="180" y="405" text-anchor="middle" font-size="12">LED phải có điện trở nối tiếp</text>
</svg>