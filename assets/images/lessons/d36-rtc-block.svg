<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ khối chức năng IC thời gian thực bù nhiệt DS3231 — Bài 36</title>
<desc id="desc">Dao động TCXO 32.768kHz → Bộ đếm thời gian BCD → Giao tiếp I2C → Chuyển nguồn pin CR2032 → Đầu ra ngắt báo thức INT/SQW</desc>
<rect width="960" height="280" rx="16" fill="#0d1829" stroke="#1e293b" stroke-width="1.5"/>
<rect x="24" y="18" width="912" height="48" rx="8" fill="#14243b" stroke="#253a56" stroke-width="1"/>
<rect x="34" y="26" width="180" height="32" rx="6" fill="#1e3a5f"/>
<text x="124" y="47" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">BÀI 36 · KIẾN TRÚC RTC</text>
<text x="229" y="48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Sơ đồ khối chức năng IC thời gian thực bù nhiệt DS3231</text>
<rect x="24" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 25 91 Q 25 86 30 86 L 179 86 Q 184 86 184 91 L 184 91 L 25 91 Z" fill="#38bdf8"/>
<rect x="34" y="99" width="26" height="20" rx="4" fill="#0284c7"/>
<text x="47" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">01</text>
<text x="66" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Dao động TCXO</text>
<line x1="34" y1="127" x2="175" y2="127" stroke="#253852" stroke-width="1"/>
<text x="34" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Thạch anh 32.768 kHz</text>
<text x="34" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tích hợp kèm cảm biến</text>
<text x="34" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">nhiệt tự động bù trôi</text>
<text x="34" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tần số ±2ppm.</text>
<path d="M 190 172 L 204 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 200 168 L 205 172 L 200 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="211" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 212 91 Q 212 86 217 86 L 366 86 Q 371 86 371 91 L 371 91 L 212 91 Z" fill="#34d399"/>
<rect x="221" y="99" width="26" height="20" rx="4" fill="#059669"/>
<text x="234" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="253" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Bộ đếm thời gian</text>
<line x1="221" y1="127" x2="362" y2="127" stroke="#253852" stroke-width="1"/>
<text x="221" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Thanh ghi lưu trữ</text>
<text x="221" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">giây, phút, giờ, thứ,</text>
<text x="221" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">ngày, tháng, năm dưới</text>
<text x="221" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">dạng mã BCD.</text>
<path d="M 377 172 L 391 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 387 168 L 392 172 L 387 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="398" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 399 91 Q 399 86 404 86 L 553 86 Q 558 86 558 91 L 558 91 L 399 91 Z" fill="#fbbf24"/>
<rect x="408" y="99" width="26" height="20" rx="4" fill="#d97706"/>
<text x="421" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">03</text>
<text x="440" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Bus giao tiếp I2C</text>
<line x1="408" y1="127" x2="549" y2="127" stroke="#253852" stroke-width="1"/>
<text x="408" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Giao tiếp với ESP32</text>
<text x="408" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">qua chân SDA, SCL ở</text>
<text x="408" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tốc độ chuẩn 100 kHz</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">hoặc Fast 400 kHz.</text>
<path d="M 564 172 L 578 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 574 168 L 579 172 L 574 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="585" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 586 91 Q 586 86 591 86 L 740 86 Q 745 86 745 91 L 745 91 L 586 91 Z" fill="#a78bfa"/>
<rect x="595" y="99" width="26" height="20" rx="4" fill="#7c3aed"/>
<text x="608" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">04</text>
<text x="627" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Nguồn dự phòng</text>
<line x1="595" y1="127" x2="736" y2="127" stroke="#253852" stroke-width="1"/>
<text x="595" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Tự động chuyển mạch</text>
<text x="595" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">giữa rail VCC chính và</text>
<text x="595" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">pin backup CR2032 khi</text>
<text x="595" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">mất điện.</text>
<path d="M 751 172 L 765 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 761 168 L 766 172 L 761 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="772" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 773 91 Q 773 86 778 86 L 927 86 Q 932 86 932 91 L 932 91 L 773 91 Z" fill="#f472b6"/>
<rect x="782" y="99" width="26" height="20" rx="4" fill="#db2777"/>
<text x="795" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<text x="814" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Đầu ra ngắt INT</text>
<line x1="782" y1="127" x2="923" y2="127" stroke="#253852" stroke-width="1"/>
<text x="782" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Chân ngắt báo thức</text>
<text x="782" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">hẹn giờ (Alarm) đánh</text>
<text x="782" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">thức MCU và phát xung</text>
<text x="782" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">vuông SQW.</text>
</svg>
