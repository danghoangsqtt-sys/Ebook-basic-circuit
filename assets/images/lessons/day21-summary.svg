<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi xử lý tín hiệu tương tự — Cảnh báo nhiệt độ với NTC — Bài 21</title>
<desc id="desc">NTC → so ngưỡng → tải; NTC đo nhiệt: Cầu chia áp đổi nhiệt thành áp.; So ngưỡng: Comparator quyết định trạng thái.; Driver tải: Tầng transistor cấp dòng đầu ra.; Thử hai phía: Đo dưới và trên ngưỡng đặt.</desc>
