<text x="504" y="167" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">dòng lái tải còi chíp,</text>
<text x="504" y="187" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">relay hoặc LED báo động.</text>
