<text x="772" y="114" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f1f5f9">Thử nghiệm hai phía</text>
<line x1="738" y1="127" x2="922" y2="127" stroke="#253852" stroke-width="1"/>
<text x="738" y="147" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">Đo kiểm điện áp và trạng</text>
<text x="738" y="167" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">thái mạch khi nhiệt độ ở</text>
<text x="738" y="187" font-family="Arial,sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">dưới và trên ngưỡng đặt.</text>
