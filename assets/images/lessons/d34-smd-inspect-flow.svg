<text x="782" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">lúp kiểm tra mối hàn</text>
<text x="782" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">bóng và đo VCC-GND.</text>
