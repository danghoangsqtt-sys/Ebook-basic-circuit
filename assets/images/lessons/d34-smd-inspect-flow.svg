<text x="253" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Đặt linh kiện</text>
<line x1="221" y1="127" x2="362" y2="127" stroke="#253852" stroke-width="1"/>
