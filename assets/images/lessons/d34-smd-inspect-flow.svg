<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Quy trình 5 bước hàn dán linh kiện SMD và nghiệm thu PCB — Bài 34</title>
<desc id="desc">Tráng thiếc pad → Đặt linh kiện nhíp → Cố định chân chéo → Hàn hoàn thiện → Soi kính lúp &amp; Đo thông mạch</desc>
