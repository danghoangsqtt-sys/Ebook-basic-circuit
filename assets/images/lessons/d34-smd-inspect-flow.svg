<text x="408" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Chạm mỏ hàn làm chảy</text>
<text x="408" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">thiếc pad định vị để</text>
<text x="408" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">cố định; hàn tiếp chân</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">chéo góc.</text>
