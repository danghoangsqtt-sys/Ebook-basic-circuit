<text x="595" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Cấp thêm thiếc và</text>
<text x="595" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">flux hàn các chân còn</text>
<text x="595" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">lại; dùng dây hút</text>
<text x="595" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">thiếc xử lý chập.</text>
<path d="M 751 172 L 765 172" stroke="#38bdf8" stroke-width="2"/>
<path d="M 761 168 L 766 172 L 761 176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
<rect x="772" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
<path d="M 773 91 Q 773 86 778 86 L 927 86 Q 932 86 932 91 L 932 91 L 773 91 Z" fill="#f472b6"/>
<rect x="782" y="99" width="26" height="20" rx="4" fill="#db2777"/>
<text x="795" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">05</text>
<text x="814" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Vệ sinh &amp; Soi lỗi</text>
<line x1="782" y1="127" x2="923" y2="127" stroke="#253852" stroke-width="1"/>
<text x="782" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Rửa sạch cặn flux</text>
