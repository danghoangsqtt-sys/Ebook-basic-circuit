<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="title desc"><title id="title">LM358 PDIP-8: sơ đồ chân nhìn từ trên</title><desc id="desc">LM358 TI PDIP-8 nhìn từ trên, rãnh khuyết ở trên: trái trên xuống 1 OUT A, 2 IN− A, 3 IN+ A, 4 V−; phải dưới lên 5 IN+ B, 6 IN− B, 7 OUT B, 8 V+. Tụ 100 nF nối pin 8 và 4 gần IC. V− không luôn là GND: với nguồn hai cực là rail âm.</desc><rect width="360" height="360" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">LM358 PDIP-8: sơ đồ chân nhìn từ trên</text><rect x="104" y="66" width="152" height="196" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><path d="M164 66 a16 16 0 0 0 32 0" fill="#f8fafc" stroke="#1e40af" stroke-width="2"/><text x="180" y="171" text-anchor="middle" font-size="17" fill="#1e3a8a" font-weight="700">LM358</text><path class="wire" d="M84 102 h20 M256 102 h20"/><text x="76" y="107" text-anchor="end" font-size="12" fill="#0f172a" font-weight="700">1 OUT A</text><text x="284" y="107" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">8 V+</text><path class="wire" d="M84 142 h20 M256 142 h20"/><text x="76" y="147" text-anchor="end" font-size="12" fill="#0f172a" font-weight="700">2 IN− A</text><text x="284" y="147" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">7 OUT B</text><path class="wire" d="M84 182 h20 M256 182 h20"/><text x="76" y="187" text-anchor="end" font-size="12" fill="#0f172a" font-weight="700">3 IN+ A</text><text x="284" y="187" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">6 IN− B</text><path class="wire" d="M84 222 h20 M256 222 h20"/><text x="76" y="227" text-anchor="end" font-size="12" fill="#0f172a" font-weight="700">4 V−</text><text x="284" y="227" text-anchor="start" font-size="12" fill="#0f172a" font-weight="700">5 IN+ B</text><text x="180" y="294" text-anchor="middle" font-size="12" fill="#334155" font-weight="500">Nhìn từ trên • rãnh khuyết ở trên</text><text x="180" y="316" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="700">100 nF giữa chân 8 và 4</text><text x="180" y="339" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="500">V− là GND hoặc rail âm</text></svg>