<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-labelledby="title desc"><title id="title">LM358 khuếch đại đảo ±9 V</title><desc id="desc">Vin qua Rin 10 kiloohm vào IN trừ. Rf 100 kiloohm từ Vout về IN trừ. IN cộng về GND tham chiếu. Pin 8 cộng 9 V, pin 4 trừ 9 V. Ví dụ Vin cộng 0,5 V thì Vout xấp xỉ trừ 5 V khi còn trong dải hợp lệ.</desc><rect width="360" height="440" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">LM358 khuếch đại đảo ±9 V</text>
<path class="w" d="M30 195 H75 M130 195 H185 M185 195 H193 M290 223 H327 M327 223 V98 H291 M230 98 H185 V195 M193 253 H145 V290 M241 173 V128 M241 270 V313"/>
<rect class="c" x="75" y="174" width="55" height="42" rx="6"/><text x="102" y="199" text-anchor="middle" font-size="12">10 kΩ</text><text x="30" y="169" font-size="13">Vin</text>
<rect class="c" x="230" y="77" width="61" height="42" rx="6"/><text x="260" y="102" text-anchor="middle" font-size="12">Rf 100 kΩ</text><path class="w" d="M185 98 H230 M291 98 H327"/>
<path d="M193 167 L193 277 L290 223 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="208" y="202" font-size="20">−</text><text x="208" y="257" font-size="20">+</text><text x="246" y="230" text-anchor="middle" font-size="13" font-weight="700">LM358</text>
<circle cx="185" cy="195" r="4" class="n"/><text x="118" y="311" font-size="12">GND mốc 0 V</text><text x="180" y="61" text-anchor="middle" font-size="12">pin 8: +9 V</text><text x="234" y="335" text-anchor="middle" font-size="12">pin 4: −9 V</text><text x="287" y="251" font-size="12">Vout</text><text x="180" y="378" text-anchor="middle" font-size="12">Vin +0,5 V → Vout ≈ −5 V</text><text x="180" y="401" text-anchor="middle" font-size="12">Kiểm dải common-mode và tải</text>
