<text x="221" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">millis() hoặc cờ ngắt;</text>
<text x="221" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">giải phóng CPU tránh</text>
<text x="221" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">nghẽn vòng lặp.</text>
