<text x="408" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tra lỗi checksum và</text>
<text x="408" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">biên giới hạn.</text>
