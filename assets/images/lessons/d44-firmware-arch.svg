<title id="title">Kiến trúc máy trạng thái (FSM) và lập lịch nhiệm vụ đồ án — Bài 44</title>
<desc id="desc">Khởi tạo INIT → Chờ IDLE millis() → Đọc cảm biến SENSE → Xử lý logic PROCESS → Xuất tín hiệu ACTUATE/LOG</desc>
