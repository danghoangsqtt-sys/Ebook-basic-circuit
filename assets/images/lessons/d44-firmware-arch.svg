<text x="34" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">bus I2C/SPI và tự chẩn</text>
<text x="34" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">đoán phần cứng.</text>
