<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-labelledby="title desc"><title id="title">Cầu chia áp LDR cho ADC</title><desc id="desc">3,3 V qua R_fixed 10 kΩ tới nút Vout, rồi LDR xuống GND. Vout đi tới đầu vào ADC của ESP32. Trời sáng R_LDR nhỏ nên Vout thấp.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="360" height="420" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<path class="w" d="M120 60 V350 M120 195 H250"/>
<text x="180" y="28" class="h" text-anchor="middle">Cầu chia áp LDR</text>
<circle cx="120" cy="60" r="4.5" class="c"/>
<text x="136" y="56" class="b">VCC = 3,3 V</text>
<rect class="c" x="107" y="90" width="26" height="50" rx="4"/>
<text x="148" y="120">R_fixed = 10 kΩ</text>
<circle cx="120" cy="195" r="4.5" class="n"/>
<circle cx="250" cy="195" r="4.5" class="c"/>
<text x="262" y="192" class="b">Vout</text>
<text x="262" y="210" class="m">→ ADC ESP32</text>
<rect class="c" x="107" y="240" width="26" height="50" rx="4"/>
<text x="100" y="270" class="b" text-anchor="end">LDR</text>
<path class="ao" d="M205 232 L150 255" marker-end="url(#ao)"/>
<path class="ao" d="M210 252 L150 275" marker-end="url(#ao)"/>
<text x="214" y="240" class="m">ánh sáng</text>
<path class="w" d="M120 350 V360 M105 360 H135 M110 366 H130 M115 372 H125"/>
<text x="142" y="372" class="m">GND</text>
<text x="180" y="408" class="m" text-anchor="middle">Sáng: R_LDR nhỏ → Vout thấp</text>
</svg>
