<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-labelledby="title desc"><title id="title">Luồng xử lý: setup, loop và ISR nút nhấn</title><desc id="desc">Biến thể DHT22: setup chạy một lần, khởi tạo Serial, DHT22, I2C với OLED, SPI với SD, ngắt nút nhấn và bộ lập lịch millis. loop lặp mãi: mỗi 2000 ms đọc cảm biến, kiểm tra NaN, cập nhật OLED, cảnh báo nếu nhiệt độ trên 35; mỗi 10000 ms ghi SD; nếu cờ nút nhấn đặt thì in tóm tắt. ISR chỉ đặt cờ.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="360" height="560" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<text x="180" y="26" class="h" text-anchor="middle">Luồng xử lý của chương trình</text>
<rect class="p" x="15" y="42" width="330" height="130" rx="8"/>
<text x="25" y="62" class="b">setup()  (chạy 1 lần)</text>
<text x="25" y="84" class="m">• Serial.begin(115200)</text>
<text x="25" y="102" class="m">• DHT22 + OLED I2C: begin()</text>
<text x="25" y="120" class="m">• SPI: SD.begin()</text>
<text x="25" y="138" class="m">• attachInterrupt(btnPin, onBtn, FALLING)</text>
<text x="25" y="156" class="m">• Khởi tạo timer hoặc lịch millis()</text>
<path class="a" d="M180 172 L180 206" marker-end="url(#ah)"/>
<rect class="z" x="15" y="208" width="330" height="200" rx="8"/>
<text x="25" y="228" class="b">loop()  (lặp mãi)</text>
<text x="25" y="250" class="m">• Mỗi 2000 ms: đọc DHT22</text>
<text x="25" y="268" class="m">     – Kiểm tra NaN, bỏ mẫu lỗi</text>
<text x="25" y="286" class="m">     – Cập nhật OLED</text>
<text x="25" y="304" class="m">     – Nếu nhiệt độ &gt; 35: LED ON + buzzer</text>
<text x="25" y="322" class="m">• Mỗi 10000 ms: ghi SD: millis,temp,humi</text>
<text x="25" y="340" class="m">• Nếu btnFlag = true: in tóm tắt qua Serial</text>
<rect class="y" x="15" y="452" width="330" height="78" rx="8"/>
<text x="25" y="474" class="b">ISR onBtn()  (ngắt nút nhấn)</text>
<text x="25" y="496" class="m">• btnFlag = true  (chỉ đặt cờ)</text>
<text x="25" y="514" class="m">• Không xử lý nặng trong ISR</text>
<path class="ao" stroke-dasharray="6 4" marker-end="url(#ao)" d="M300 452 L300 410"/>
<text x="292" y="436" class="o b" text-anchor="end">cờ btnFlag</text>
</svg>
