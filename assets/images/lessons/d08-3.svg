<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-labelledby="title desc"><title id="title">Vị trí tụ tách nguồn 100 nF</title><desc id="desc">Tụ 100 nF nối giữa ray VCC và ray GND, đặt sát chân VCC và GND của IC. Chân VCC và GND của IC lấy từ hai ray này.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs><rect width="360" height="330" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:13px}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{stroke:#334155;stroke-width:3.5;fill:none;stroke-linecap:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.p{fill:#dbeafe;stroke:#1e40af;stroke-width:2}.y{fill:#fef3c7;stroke:#b45309;stroke-width:2}.z{fill:#dcfce7;stroke:#15803d;stroke-width:2}.d{stroke:#64748b;stroke-width:1.5;fill:none;stroke-dasharray:5 4}.gr{stroke:#cbd5e1;stroke-width:1;fill:none}.n{fill:#0f766e}.b{font-weight:700}.m{fill:#475569;font-size:12px}.g{fill:#0f766e}.o{fill:#b45309}.h{font-size:15px;font-weight:700}.s{font-size:11px}.wh{fill:#fff}.a{stroke:#0f766e;stroke-width:2.2;fill:none}.ao{stroke:#b45309;stroke-width:2.2;fill:none}</style>
<path class="w" d="M30 100 H275 V135 M30 250 H275 V215 M170 100 V170 M170 250 V180"/>
<text x="180" y="28" class="h" text-anchor="middle">Tụ tách nguồn đặt sát IC</text>
<circle cx="30" cy="100" r="4.5" class="c"/>
<text x="30" y="86" class="b">VCC</text>
<text x="30" y="242" class="b">GND</text>
<path class="k" d="M153 170 H187 M153 180 H187"/>
<circle cx="170" cy="100" r="4.5" class="n"/>
<circle cx="170" cy="250" r="4.5" class="n"/>
<text x="150" y="180" class="b" text-anchor="end">C = 100 nF</text>
<rect class="p" x="230" y="135" width="90" height="80" rx="8"/>
<text x="275" y="168" class="b" text-anchor="middle">IC</text>
<text x="275" y="152" class="s" text-anchor="middle">VCC</text>
<text x="275" y="207" class="s" text-anchor="middle">GND</text>
<path class="ao" marker-start="url(#ao)" marker-end="url(#ao)" d="M174 68 L271 68"/>
<text x="222" y="56" class="o b" text-anchor="middle">sát chân IC</text>
<text x="180" y="300" class="m" text-anchor="middle">Vòng tụ → chân VCC → IC → chân GND càng ngắn càng tốt</text>
</svg>
