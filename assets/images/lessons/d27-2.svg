<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 491" width="360" height="491" role="img" aria-labelledby="title desc"><title id="title">Quy trình nhận diện module PIR HC-SR501</title><desc id="desc">Không có PCB/revision cụ thể nên không thể xác nhận thứ tự ba chân từ hình. Tắt nguồn; đọc nhãn VCC, OUT, GND trên PCB thực; đối chiếu tài liệu đúng module; cấp VCC theo nhãn; đo OUT HIGH/LOW với GND và chỉ nối GPIO 3,3 V sau khi xác nhận mức điện áp. Không suy vị trí chân từ ảnh hoặc hướng biến trở; nếu OUT vượt giới hạn GPIO dùng chuyển mức.</desc><rect width="360" height="491" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Quy trình nhận diện module PIR HC-SR501</text><rect x="16" y="55" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="74" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">CHƯA CÓ REVISION</text><rect class="node" x="31" y="93" width="298" height="36" rx="8"/><text x="180" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Không vẽ thứ tự chân cố định</text><path class="wire" d="M180 129 v13"/><path d="M175 137 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="147" width="298" height="36" rx="8"/><text x="180" y="170" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Không cấp nguồn theo suy đoán</text><rect x="16" y="196" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="215" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">NHẬN DIỆN</text><rect class="node" x="31" y="234" width="298" height="36" rx="8"/><text x="180" y="257" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Tìm nhãn VCC / OUT / GND</text><path class="wire" d="M180 270 v13"/><path d="M175 278 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="288" width="298" height="36" rx="8"/><text x="180" y="311" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Đối chiếu datasheet PCB thực</text><rect x="16" y="337" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="356" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">ĐO TRƯỚC KHI NỐI</text><rect class="node" x="31" y="375" width="298" height="36" rx="8"/><text x="180" y="398" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Đo OUT so với GND</text><path class="wire" d="M180 411 v13"/><path d="M175 419 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="429" width="298" height="36" rx="8"/><text x="180" y="452" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Chỉ nối GPIO khi đúng mức</text></svg>