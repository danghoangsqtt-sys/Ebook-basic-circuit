<text x="595" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">toán số học, lọc số</text>
<text x="595" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">FIR/IIR và xử lý thuật</text>
<text x="595" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">toán.</text>
