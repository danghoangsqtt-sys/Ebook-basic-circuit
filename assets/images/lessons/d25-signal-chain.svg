<text x="66" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Tín hiệu Analog</text>
<line x1="34" y1="127" x2="175" y2="127" stroke="#253852" stroke-width="1"/>
<text x="34" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Tín hiệu điện áp</text>
<text x="34" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tương tự liên tục theo</text>
<text x="34" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">thời gian từ cảm biến.</text>
<path d="M 190 172 L 204 172" stroke="#38bdf8" stroke-width="2"/>
