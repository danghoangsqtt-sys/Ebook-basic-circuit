<path d="M 212 91 Q 212 86 217 86 L 366 86 Q 371 86 371 91 L 371 91 L 212 91 Z" fill="#34d399"/>
<rect x="221" y="99" width="26" height="20" rx="4" fill="#059669"/>
<text x="234" y="113" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">02</text>
<text x="253" y="114" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#f1f5f9">Sample &amp; Hold</text>
<line x1="221" y1="127" x2="362" y2="127" stroke="#253852" stroke-width="1"/>
<text x="221" y="147" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Lấy mẫu với tần số fs</text>
<text x="221" y="167" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">&gt;= 2*fmax theo định lý</text>
<text x="221" y="187" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Nyquist và giữ áp nạp</text>
<text x="221" y="207" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#94a3b8">tụ.</text>
