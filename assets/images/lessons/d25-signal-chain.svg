<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi chuyển đổi tín hiệu Analog ↔ Digital (ADC &amp; DAC) — Bài 25</title>
<desc id="desc">Tín hiệu Analog Vin → Lấy mẫu Sample &amp; Hold → Lượng tử hóa Quantization → MCU/DSP Xử lý → DAC &amp; Lọc tái tạo → Tín hiệu Analog Vout</desc>
<rect width="960" height="280" rx="16" fill="#0d1829" stroke="#1e293b" stroke-width="1.5"/>
<rect x="24" y="18" width="912" height="48" rx="8" fill="#14243b" stroke="#253a56" stroke-width="1"/>
<rect x="34" y="26" width="180" height="32" rx="6" fill="#1e3a5f"/>
<text x="124" y="47" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">BÀI 25 · CHUỖI TÍN HIỆU</text>
<text x="229" y="48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Chuỗi chuyển đổi tín hiệu Analog ↔ Digital (ADC &amp; DAC)</text>
<rect x="24" y="85" width="161" height="175" rx="10" fill="#162238" stroke="#2a3f5f" stroke-width="1.2"/>
