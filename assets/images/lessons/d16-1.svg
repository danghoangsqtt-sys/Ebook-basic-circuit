<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img" aria-labelledby="title desc"><title id="title">Relay DC: cuộn và diode song song</title><desc id="desc">+5 V nối tới đầu trên cuộn relay và cathode diode. Đầu dưới cuộn và anode diode cùng nối collector BC337. Emitter về GND. GPIO qua điện trở 330 ohm vào base.</desc><rect width="360" height="490" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.w{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.c{fill:#fff;stroke:#475569;stroke-width:2}.n{fill:#0f766e}.r{fill:#b45309}</style><text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700">Relay DC: cuộn và diode song song</text>
<path class="w" d="M99 86 H262 M99 86 V125 M99 205 V255 H262 M262 86 V145 M262 205 V255 M99 255 V284 M99 352 V403 H262"/>
<text x="181" y="77" text-anchor="middle" font-size="15" font-weight="700">+5 V</text>
<rect class="c" x="63" y="125" width="72" height="80" rx="7"/><text x="99" y="161" text-anchor="middle" font-size="13">Cuộn</text><text x="99" y="180" text-anchor="middle" font-size="13">relay</text>
<path d="M239 185 L285 185 L262 145 Z" fill="#fcd34d" stroke="#92400e" stroke-width="2"/><path d="M238 143 H286" stroke="#92400e" stroke-width="4"/><text x="300" y="151" font-size="12" font-weight="700">K</text><text x="300" y="202" font-size="12" font-weight="700">A</text><text x="263" y="229" text-anchor="middle" font-size="12">1N4007</text>
<circle cx="99" cy="255" r="4" class="n"/><text x="144" y="248" font-size="12">nút collector</text>
<rect x="65" y="284" width="68" height="68" rx="10" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/><text x="99" y="310" text-anchor="middle" font-size="13" font-weight="700">BC337</text><text x="99" y="335" text-anchor="middle" font-size="12">C  B  E</text>
<path class="w" d="M5 319 H20 M55 319 H65"/><rect class="c" x="20" y="301" width="35" height="36" rx="5"/><text x="37" y="324" text-anchor="middle" font-size="11">R_B</text><text x="17" y="280" font-size="11">GPIO 3,3 V</text><text x="17" y="371" font-size="11">R_B = 330 Ω</text>
<circle cx="99" cy="403" r="4" class="n"/><text x="180" y="424" text-anchor="middle" font-size="13">GND nguồn 5 V = GND GPIO</text><text x="180" y="450" text-anchor="middle" font-size="12">COM/NO/NC tách khỏi cuộn DC</text>
</svg>