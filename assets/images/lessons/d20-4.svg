<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 545" width="360" height="545" role="img" aria-labelledby="title desc"><title id="title">LM358 so sánh ngưỡng chậm</title><desc id="desc">Vin vào IN+; Vref vào IN−; không hồi tiếp âm. Vout đi lên khi Vin vượt Vref và xuống khi Vin thấp hơn Vref, nhưng không đạt rail dương khi tải và nguồn giới hạn. LM358 dùng như comparator chỉ cho tín hiệu chậm, kiểm common-mode, tốc độ và trạng thái khi sát ngưỡng; thiết kế cần chuyển mạch sạch nên dùng comparator chuyên dụng/hysteresis.</desc><rect width="360" height="545" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif} .wire{stroke:#334155;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round} .node{fill:#fff;stroke:#94a3b8;stroke-width:1.5} .dot{fill:#0f766e}</style><text x="180" y="33" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">LM358 so sánh ngưỡng chậm</text><rect x="16" y="55" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="74" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">HAI ĐẦU VÀO</text><rect class="node" x="31" y="93" width="298" height="36" rx="8"/><text x="180" y="116" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vin → IN+</text><path class="wire" d="M180 129 v13"/><path d="M175 137 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="147" width="298" height="36" rx="8"/><text x="180" y="170" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vref → IN−</text><rect x="16" y="196" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="215" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">KHÔNG HỒI TIẾP</text><rect class="node" x="31" y="234" width="298" height="36" rx="8"/><text x="180" y="257" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vin &gt; Vref → Vout lên</text><path class="wire" d="M180 270 v13"/><path d="M175 278 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="288" width="298" height="36" rx="8"/><text x="180" y="311" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vin &lt; Vref → Vout xuống</text><rect x="16" y="337" width="328" height="28" rx="8" fill="#dbeafe"/><text x="29" y="356" text-anchor="start" font-size="12" fill="#1e3a8a" font-weight="700">GIỚI HẠN</text><rect class="node" x="31" y="375" width="298" height="36" rx="8"/><text x="180" y="398" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Vout HIGH không bằng V+</text><path class="wire" d="M180 411 v13"/><path d="M175 419 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="429" width="298" height="36" rx="8"/><text x="180" y="452" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Ngưỡng nhiễu: thêm hysteresis</text><path class="wire" d="M180 465 v13"/><path d="M175 473 l5 6 5 -6" fill="none" stroke="#334155" stroke-width="2"/><rect class="node" x="31" y="483" width="298" height="36" rx="8"/><text x="180" y="506" text-anchor="middle" font-size="14" fill="#0f172a" font-weight="500">Kiểm common-mode, tải, tốc độ</text></svg>