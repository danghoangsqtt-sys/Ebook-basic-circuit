<title id="title">Robot WiFi tránh vật cản — Bài 42</title>
<desc id="desc">ESP32 điều phối robot hai bánh; Cảm biến khoảng cách: HC-SR04, ECHO hạ mức 3,3 V.; ESP32 quyết định: AUTO tránh vật hoặc nhận lệnh web.; TB6612FNG lái motor: Hai motor DC, nguồn đủ dòng đỉnh.; Nguồn LiPo bảo vệ: Sạc, bảo vệ và boost được kiểm.</desc>
