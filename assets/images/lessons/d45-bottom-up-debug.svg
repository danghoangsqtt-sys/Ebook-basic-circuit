<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Chiến lược tích hợp Bottom-Up và gỡ lỗi có cấu trúc — Bài 45</title>
<desc id="desc">Kiểm tra nguồn &amp; phần cứng → Test HAL Driver độc lập → Lớp xử lý cảm biến → Tích hợp State Machine → Debug có WDT</desc>
