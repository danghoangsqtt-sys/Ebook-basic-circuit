<text x="66" y="230" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">1</text>
<text x="116" y="231" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Điện áp V</text>
<text x="56" y="278" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Chênh lệch thế năng giữa</text>
<text x="56" y="316" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">hai điểm; luôn cần điểm</text>
<text x="56" y="354" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">tham chiếu.</text>
<path d="M 18 490 H 29" stroke="#54d6c9" stroke-width="4"/>
<circle cx="18" cy="490" r="7" fill="#54d6c9"/>
<rect x="29" y="390" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="390" width="7" height="200" rx="3" fill="#f5bd6a"/>
<circle cx="77" cy="437" r="24" fill="#f5bd6a"/>
<text x="66" y="446" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">2</text>
<text x="116" y="447" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Dòng điện I</text>
<text x="56" y="494" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Điện tích đi qua tiết diện</text>
<text x="56" y="532" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">trong một giây; đơn vị</text>
<text x="56" y="570" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">ampe.</text>
<path d="M 18 706 H 29" stroke="#54d6c9" stroke-width="4"/>
<circle cx="18" cy="706" r="7" fill="#54d6c9"/>
<rect x="29" y="606" width="502" height="200" rx="20" fill="#182a43" stroke="#42617e" stroke-width="2"/>
<rect x="29" y="606" width="7" height="200" rx="3" fill="#9cb7ff"/>
<circle cx="77" cy="653" r="24" fill="#9cb7ff"/>
<text x="66" y="662" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">3</text>
<text x="116" y="663" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">GND</text>
<text x="56" y="710" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Mốc 0 V do mạch chọn; đường</text>
<text x="56" y="748" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">về giúp khép kín vòng dòng.</text>
