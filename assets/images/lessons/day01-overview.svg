<rect x="29" y="822" width="7" height="200" rx="3" fill="#e7a2cb"/>
<circle cx="77" cy="869" r="24" fill="#e7a2cb"/>
<text x="66" y="878" fill="#101b2d" font-size="29" font-weight="700" font-family="Arial, sans-serif">4</text>
<text x="116" y="879" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial, sans-serif">Đo điện áp</text>
<text x="56" y="926" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">Đặt hai que đo song song</text>
<text x="56" y="964" fill="#dce9f3" font-size="29" font-weight="400" font-family="Arial, sans-serif">với hai điểm cần so sánh.</text>
<rect x="29" y="1040" width="502" height="54" rx="16" fill="#25415b"/>
<text x="47" y="1076" fill="#f8fafc" font-size="27" font-weight="700" font-family="Arial, sans-serif">Nguồn → tải → đường về → nguồn</text>
</svg>
